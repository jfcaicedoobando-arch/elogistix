name: "Setup Bun + Install"
description: "Setup Bun, restore install cache, and run `bun install --frozen-lockfile`."
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # v13.322.1 (GHA-audit D) — Pin explícito: el runtime también es
        # supply chain. Bumpear deliberadamente tras verificar la suite.
        bun-version: "1.4.0"

    # v13.514.0 (auditoría CI · Fase 2) — Cache de `node_modules` completo,
    # no sólo del tarball cache de Bun. Con hit exacto de `bun.lock` +
    # `package.json` el install se omite por completo (~25-35 s por job × 20
    # jobs). Sin hit exacto NO se restaura nada parcial: un `node_modules`
    # a medias es peor que instalar de cero.
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-bun1.4.0-${{ hashFiles('bun.lock', 'package.json') }}

    - name: Cache Bun deps
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      # --ignore-scripts: protección contra postinstall maliciosos en deps
      # transitivas. Las deps con binarios nativos que usamos (esbuild, @swc/core,
      # @react-pdf/renderer) descargan/resuelven binarios en runtime o vía optional
      # deps, por eso esto no rompe el build. Si agregas una dep con postinstall
      # imprescindible, considera quitar el flag o whitelistear con trustedDependencies.
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Verify node_modules (cache hit)
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      shell: bash
      # Red de seguridad: si el cache trajo un árbol corrupto/incompleto,
      # reinstalamos en lugar de fallar 20 jobs con errores de resolución.
      run: |
        if ! bun pm ls > /dev/null 2>&1; then
          echo "::warning::node_modules restaurado del cache no es válido; reinstalando."
          rm -rf node_modules
          bun install --frozen-lockfile --ignore-scripts
        fi

