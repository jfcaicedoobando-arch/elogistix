name: "Setup Bun + Install"
description: "Setup Bun, restore install cache, and run `bun install --frozen-lockfile`."
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.x"

    - name: Cache Bun deps
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      # --ignore-scripts: protección contra postinstall maliciosos en dependencias transitivas.
      run: bun install --frozen-lockfile --ignore-scripts
