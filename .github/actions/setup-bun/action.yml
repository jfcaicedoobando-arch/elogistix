name: "Setup Bun + Install"
description: "Setup Bun, restore install cache, and run `bun install --frozen-lockfile`."
outputs:
  node-version:
    description: "Exact installed Node.js version, including the v prefix."
    value: ${{ steps.setup-node.outputs.node-version }}
  cache-hit:
    description: "Exact node_modules cache hit, false if repaired/reinstalled."
    value: ${{ steps.cache-node-modules.outputs.cache-hit == 'true' && steps.verify-cache.outputs.reinstalled != 'true' }}
runs:
  using: "composite"
  steps:
    - name: Setup Node
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26.13.0"
        package-manager-cache: false
    - name: Show Node runtime
      shell: bash
      run: node --version
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # v13.322.1 (GHA-audit D) — Pin explícito: el runtime también es
        # supply chain. Bumpear deliberadamente tras verificar la suite.
        bun-version: "1.4.4"

    - name: Verify runtime pins
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import { readFileSync } from 'node:fs';
        import { execFileSync } from 'node:child_process';
        const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
        const bun = execFileSync('bun', ['--version'], { encoding: 'utf8' }).trim();
        assert.equal(process.versions.node, pkg.engines.node);
        assert.equal(bun, pkg.engines.bun);
        assert.equal(pkg.packageManager, `bun@${bun}`);
        for (const file of ['.nvmrc', '.node-version'])
          assert.equal(readFileSync(file, 'utf8').trim(), process.versions.node);
        assert.equal(readFileSync('.bun-version', 'utf8').trim(), bun);
        console.log(`Node ${process.versions.node}; Bun ${bun}`);
        NODE

    # v13.514.0 (auditoría CI · Fase 2) — Cache de `node_modules` completo,
    # no sólo del tarball cache de Bun. Con hit exacto de `bun.lock` +
    # `package.json` el install se omite por completo (~25-35 s por job × 20
    # jobs). Sin hit exacto NO se restaura nada parcial: un `node_modules`
    # a medias es peor que instalar de cero.
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node${{ steps.setup-node.outputs.node-version }}-node-modules-bun1.4.4-${{ hashFiles('bun.lock', 'package.json') }}

    - name: Cache Bun deps
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      # --ignore-scripts: protección contra postinstall maliciosos en deps
      # transitivas. Las deps con binarios nativos que usamos (esbuild, @swc/core,
      # @react-pdf/renderer) descargan/resuelven binarios en runtime o vía optional
      # deps, por eso esto no rompe el build. Si agregas una dep con postinstall
      # imprescindible, considera quitar el flag o whitelistear con trustedDependencies.
      run: |
        lock_before=$(sha256sum bun.lock)
        bun install --frozen-lockfile --ignore-scripts
        test "$lock_before" = "$(sha256sum bun.lock)"

    - name: Verify node_modules (cache hit)
      id: verify-cache
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      shell: bash
      # Red de seguridad: si el cache trajo un árbol corrupto/incompleto,
      # reinstalamos en lugar de fallar 20 jobs con errores de resolución.
      run: |
        if ! bun pm ls > /dev/null 2>&1; then
          echo "::warning::node_modules restaurado del cache no es válido; reinstalando."
          echo "reinstalled=true" >> "$GITHUB_OUTPUT"
          rm -rf node_modules
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile --ignore-scripts
          test "$lock_before" = "$(sha256sum bun.lock)"
        fi

