name: restore-rls-snapshot
description: >-
  Instala el cliente de Postgres 17, descarga el artifact `rls-db-snapshot` y lo
  restaura en la base `postgres` del servicio del job. v13.808.0 (YAGNI · Ola 10)
  — antes estos 4 pasos estaban copiados en 4 jobs de `rls-tests.yml`
  (rls-suites, rls-guards, types-drift, schema-baseline), así que cualquier ajuste
  al restore había que aplicarlo 4 veces y se desincronizaba.

inputs:
  pg-version:
    description: >-
      Versión mayor del cliente psql/pg_restore a instalar. Debe ser >= a la
      mayor de la imagen Postgres pinneada en el workflow.
    required: false
    default: "17"
  snapshot-path:
    description: Carpeta destino del artifact del dump.
    required: false
    default: .rls-snapshot/

runs:
  using: composite
  steps:
    - name: Cliente de Postgres ${{ inputs.pg-version }} (paridad con la imagen pinneada)
      uses: ./.github/actions/setup-pg-client
      with:
        version: ${{ inputs.pg-version }}

    - name: Download database snapshot
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: rls-db-snapshot
        path: ${{ inputs.snapshot-path }}

    - name: Create Supabase roles before restore
      # El snapshot incluye policies con `TO authenticated/anon/service_role`;
      # pg_restore falla con "role does not exist" si esos roles no están
      # creados en la BD destino (vanilla Postgres no los trae).
      # v13.514.0 — La lista vive en `_ci_roles.sql` (antes: 5 copias inline).
      shell: bash
      run: psql -v ON_ERROR_STOP=1 -X -q -f supabase/tests/rls/_ci_roles.sql

    - name: Restore database snapshot
      # pg_restore es ~10x más rápido que rehacer bootstrap+migrations.
      # Restauramos GRANTs (sin --no-privileges) para que SET ROLE
      # authenticated en las suites pueda leer/escribir sus tablas.
      shell: bash
      run: |
        set -euo pipefail
        pg_restore --no-owner --dbname=postgres \
          "${{ inputs.snapshot-path }}/db.dump"
