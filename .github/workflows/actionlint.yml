name: actionlint

# Lint estático de los workflows y composite actions de `.github/`.
# Corre solo cuando un PR modifica archivos relevantes.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false

      - name: Download actionlint
        id: get
        env:
          # Pinned actionlint version. NUNCA dejar flotante: se ejecuta en el
          # runner con acceso a GITHUB_TOKEN, así que un compromiso del repo
          # upstream sería supply-chain crítico.
          # Para bumpear: revisar https://github.com/rhysd/actionlint/releases
          # y subir la versión deliberadamente.
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          # v13.322.1 (GHA-audit H1) — Antes se hacía `curl | bash` desde la
          # rama `main` del repo upstream: código remoto flotante ejecutándose
          # en el runner. Ahora descargamos el binario del release pineado y
          # verificamos su checksum contra el fichero de checksums del mismo
          # release. Cero ejecución de scripts remotos.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball"      "${base}/${tarball}"
          curl -sSfL -o checksums.txt   "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" actionlint
          echo "bin=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        run: |
          set -euo pipefail
          "${{ steps.get.outputs.bin }}" -color
