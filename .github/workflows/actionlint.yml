name: actionlint

# Lint estático de los workflows y composite actions de `.github/`.
# Corre solo cuando un PR modifica archivos relevantes.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/actionlint.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/actionlint.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download actionlint
        id: get
        env:
          # Pinned actionlint version. NUNCA dejar flotante: el script de
          # `main` se ejecuta en el runner con acceso a GITHUB_TOKEN, así que
          # un compromiso del repo upstream sería supply-chain crítico.
          # Para bumpear: revisar https://github.com/rhysd/actionlint/releases
          # y subir la versión deliberadamente.
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          echo "bin=$(pwd)/actionlint" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        run: |
          set -euo pipefail
          "${{ steps.get.outputs.bin }}" -color
