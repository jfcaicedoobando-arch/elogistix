name: deploy-gate

# Gate de promoción a producción (post-merge).
#
# Se ejecuta DESPUÉS del merge a `main` y decide si el commit es apto para
# promoverse a producción. Bloquea (falla + abre issue) si:
#   1) La suite de RLS del mismo SHA no terminó en verde.
#   2) La auditoría de migraciones/esquema falla.
#   3) El radar de drift detecta una migración NUEVA que no aplica en limpio.
#   4) La guardia de integridad (P-10) encuentra RPC ambiguas, enums rotos o
#      tablas con RLS sin políticas.
#
# El resultado se publica en el summary como "PROMOCIÓN AUTORIZADA/BLOQUEADA"
# y este workflow se usa como required check del entorno de producción.
#
# v13.514.0 (auditoría CI · Fase 2) — Se eliminó el job `suite-rls`, que hacía
# polling de hasta 25 min contra la API de Actions (runner facturado sin hacer
# nada). Ahora el veredicto de RLS llega por `workflow_run`:
#   - push a `main` que TOCA `supabase/**` → el gate NO corre en el push; corre
#     cuando `rls-tests` termina, y lee su conclusión del evento.
#   - push a `main` que NO toca `supabase/**` → `rls-tests` no se dispara, así
#     que el gate corre en el push con el veredicto de RLS marcado "no aplica".
# De esta forma ningún push a main queda sin gate y no se paga polling.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["rls-tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gate-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  POSTGRES_IMAGE: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
  # Migraciones anteriores a este corte quedan exentas del radar de drift
  # (deuda histórica ya cubierta por `_ci_drift.sql`). Toda migración posterior
  # DEBE aplicar en una base limpia.
  #
  # Fuente única de verdad: `supabase/tests/rls/drift-corte.env`, leída también
  # por `rls-tests.yml`. Antes existían dos literales (`DRIFT_BASELINE` aquí y
  # `DRIFT_CORTE` allá) que podían divergir en silencio.
  DRIFT_CORTE_FILE: supabase/tests/rls/drift-corte.env

jobs:
  # ---------------------------------------------------------------------
  # 0) CONTEXTO — resuelve el SHA a auditar y si este evento debe gatear.
  # ---------------------------------------------------------------------
  contexto:
    name: Gate — contexto
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decidir.outputs.run }}
      sha: ${{ steps.decidir.outputs.sha }}
      rls: ${{ steps.decidir.outputs.rls }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: ¿El push tocó la base de datos?
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'supabase/**'

      - name: Decidir alcance del gate
        id: decidir
        env:
          EVENTO: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
        run: |
          set -euo pipefail
          sha="${WR_SHA:-$GITHUB_SHA}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          case "$EVENTO" in
            workflow_run)
              if [ "$WR_BRANCH" != "main" ] || [ "$WR_EVENT" != "push" ]; then
                echo "rls-tests no vino de un push a main ($WR_EVENT/$WR_BRANCH): el gate no aplica."
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "rls=no-aplica" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "rls=$WR_CONCLUSION" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [ "$BACKEND_CHANGED" = "true" ]; then
                echo "El push toca supabase/**: el gate corre cuando rls-tests termine."
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "rls=pendiente" >> "$GITHUB_OUTPUT"
              else
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "rls=no-aplica" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "rls=no-aplica" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ---------------------------------------------------------------------
  # 1) Auditoría de migraciones y esquema (sin base de datos).
  # ---------------------------------------------------------------------
  auditoria-migraciones:
    name: Gate — auditoría de migraciones
    needs: contexto
    if: needs.contexto.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.contexto.outputs.sha }}
          persist-credentials: false

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: audit:migrations + audit:schema + audit:rpc-columns
        run: |
          set -e
          fail=0
          bun run audit:migrations  > /tmp/g-migrations.log  2>&1 & M=$!
          bun run audit:schema      > /tmp/g-schema.log      2>&1 & S=$!
          bun run audit:rpc-columns > /tmp/g-rpccols.log     2>&1 & K=$!
          wait $M || { echo '❌ audit:migrations';  cat /tmp/g-migrations.log; fail=1; }
          wait $S || { echo '❌ audit:schema';      cat /tmp/g-schema.log;     fail=1; }
          wait $K || { echo '❌ audit:rpc-columns'; cat /tmp/g-rpccols.log;    fail=1; }
          if [ "$fail" = "1" ]; then
            echo "## ❌ Gate: auditoría de migraciones" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## ✅ Gate: auditoría de migraciones" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 2) Radar de drift — bloqueante para migraciones nuevas.
  # ---------------------------------------------------------------------
  radar-drift:
    name: Gate — radar de drift
    needs: contexto
    if: needs.contexto.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.contexto.outputs.sha }}
          persist-credentials: false

      - name: Cargar corte de drift (fuente única)
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$DRIFT_CORTE_FILE" >> "$GITHUB_ENV"

      - name: Bootstrap (stubs auth/storage/cron/net/pgmq)
        run: $PSQL -f supabase/tests/rls/_ci_bootstrap.sql

      - name: Aplicar migraciones SIN parches de drift
        run: |
          set -uo pipefail
          shopt -s nullglob
          nuevas=""
          historicas=""
          for f in $(printf '%s\n' supabase/migrations/*.sql | LC_ALL=C sort); do
            base=$(basename "$f")
            if ! sed -E \
              -e 's/^[[:space:]]+CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/    PERFORM 1; -- [ci] stubbed \2/I' \
              -e 's/^CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/SELECT 1; -- [ci] stubbed \2/I' \
              "$f" | $PSQL --single-transaction > /tmp/mig.log 2>&1; then
              sed -n '1,10p' /tmp/mig.log
              if [[ "$base" > "$DRIFT_CORTE" ]]; then
                echo "::error file=$f::drift NUEVO — la migración no aplica en una base limpia"
                nuevas="$nuevas $base"
              else
                echo "::warning file=$f::drift histórico (exento del gate)"
                historicas="$historicas $base"
              fi
            fi
          done
          {
            echo "## Gate: radar de drift"
            echo ""
            echo "Baseline exento: \`$DRIFT_CORTE\`"
            if [ -n "$historicas" ]; then
              echo ""
              echo "Drift histórico (no bloquea):"
              for m in $historicas; do echo "- \`$m\`"; done
            fi
            if [ -n "$nuevas" ]; then
              echo ""
              echo "❌ Drift NUEVO (bloquea la promoción):"
              for m in $nuevas; do echo "- \`$m\`"; done
              echo ""
              echo "Acción: escribir la migración que cree los objetos faltantes en lugar de crearlos a mano en producción."
            else
              echo ""
              echo "✅ Ninguna migración nueva depende de objetos creados a mano."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$nuevas" ]

      # P-10 — Guardia de integridad: sobre la base ya migrada, detecta
      # sobrecargas ambiguas de RPC, funciones con enums renombrados y tablas
      # con RLS activo sin políticas. Debe regresar CERO filas.
      - name: Guardia de integridad de esquema (P-10)
        run: |
          set -euo pipefail
          $PSQL -A -t -f scripts/db/integrity-guard.sql > /tmp/integrity.txt
          filas=$(grep -c . /tmp/integrity.txt || true)
          if [ "$filas" != "0" ]; then
            {
              echo "## ❌ Gate: guardia de integridad de esquema"
              echo ""
              echo '```'
              cat /tmp/integrity.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/integrity.txt
            exit 1
          fi
          echo "## ✅ Gate: guardia de integridad de esquema" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # 3) Veredicto — required check para promover a producción.
  # ---------------------------------------------------------------------
  promocion:
    name: Deploy gate (promoción a producción)
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — queda registrado como deployment del environment
    # `production` y hereda sus protection rules (reviewers, ramas permitidas).
    environment: production
    timeout-minutes: 5
    needs: [contexto, auditoria-migraciones, radar-drift]
    if: always() && needs.contexto.outputs.run == 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Veredicto
        id: veredicto
        env:
          RLS_RESULT: ${{ needs.contexto.outputs.rls }}
          SHA_AUDITADO: ${{ needs.contexto.outputs.sha }}
        run: |
          # shellcheck disable=SC2016
          # Las ${...} de las líneas siguientes son parámetros de shell (expansión
          # intencional en runtime), no variables de GitHub Actions.
          fail=0
          echo "SHA auditado: $SHA_AUDITADO"
          for pair in "auditoría de migraciones:${{ needs.auditoria-migraciones.result }}" \
                      "radar de drift:${{ needs.radar-drift.result }}" \
                      "suite de RLS:${RLS_RESULT}"; do
            nombre="${pair%%:*}"
            result="${pair##*:}"
            case "$result" in
              success)
                echo "✅ $nombre"
                ;;
              no-aplica)
                # rls-tests no se disparó porque el commit no toca la base.
                echo "➖ $nombre (no aplica: sin cambios de BD)"
                ;;
              *)
                echo "❌ $nombre ($result)"
                fail=1
                ;;
            esac
          done
          if [ "$fail" = "1" ]; then
            {
              echo "## 🚫 PROMOCIÓN BLOQUEADA"
              echo ""
              echo "No publiques este commit en producción hasta que los gates estén en verde."
              echo ""
              echo "Nota: este veredicto no publica automáticamente en Lovable. El frontend sigue requiriendo \`Share → Publish → Update\` en el editor de Lovable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "## ✅ PROMOCIÓN AUTORIZADA"
            echo ""
            echo "Nota: este veredicto no publica automáticamente en Lovable. El frontend sigue requiriendo \`Share → Publish → Update\` en el editor de Lovable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir/actualizar issue de bloqueo
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const label = 'deploy-blocked';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '🚫 **Promoción a producción bloqueada** por el deploy gate.',
              '',
              `- Run: ${runUrl}`,
              `- SHA: \`${{ toJSON(needs.contexto.outputs.sha) }}\``,
              '',
              '| Gate | Resultado |',
              '| --- | --- |',
              `| Auditoría de migraciones | ${{ toJSON(needs.auditoria-migraciones.result) }} |`,
              `| Radar de drift | ${{ toJSON(needs.radar-drift.result) }} |`,
              `| Suite de RLS | ${{ toJSON(needs.contexto.outputs.rls) }} |`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚫 Deploy gate bloqueado (${new Date().toISOString().slice(0, 10)})`,
                body,
                labels: [label],
              });
            }
