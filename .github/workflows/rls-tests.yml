name: rls-tests

# Suites SQL de RLS + guardas de base de datos contra un Postgres efímero.
#
# CI simplificado (YAGNI): UN job, UNA instancia Postgres, sin matrix, sin
# snapshot cacheado ni transporte de dumps entre jobs, sin radar de types.ts ni
# guards RADAR no bloqueantes, sin cron.
#
# Orden intencional:
#   bootstrap → squash + replay ordenado → candado service_role-only →
#   post-migrate → verify RLS → integrity guard → baseline de esquema
#   (ANTES de cualquier fixture) → guards del manifiesto → suites RLS →
#   pruebas selector148 seriales en clones propios → concurrencia existente.
#
# Fail-closed: si el bootstrap o la preparación falla, el job falla y el
# check "RLS tests result" queda rojo.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "drizzle/**"
      - "drizzle.config.ts"
      - "supabase/tests/**"
      - "supabase/schema/**"
      - "scripts/ci/rls-prepare-db.sh"
      - "scripts/ci/audit54-cxc-forward-runtime.sh"
      - "scripts/ci/audit54-cxc-runtime-fixtures.py"
      - "scripts/ci/selector148/**"
      - "scripts/ci/financial49/**"
      - "scripts/ci/receivable155/**"
      - "scripts/ci/pricing-container/**"
      - "scripts/ci/leads-scope/**"
      - "scripts/ci/test-catalog.*"
      - "scripts/ci/test-catalog/**"
      - "scripts/ci/run-rls-suites.sh"
      - "scripts/ci/run-guards.sh"
      - "scripts/ci/concurrencia-cotizacion-ganadora.sh"
      - "scripts/ci/concurrencia-factura-manual.sh"
      - "scripts/ci/concurrencia-cobro.sh"
      - "scripts/ci/fixtures/**"
      - "scripts/db/**"
      - ".github/actions/setup-pg-client/**"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "drizzle/**"
      - "drizzle.config.ts"
      - "supabase/tests/**"
      - "supabase/schema/**"
      - "scripts/ci/rls-prepare-db.sh"
      - "scripts/ci/audit54-cxc-forward-runtime.sh"
      - "scripts/ci/audit54-cxc-runtime-fixtures.py"
      - "scripts/ci/selector148/**"
      - "scripts/ci/financial49/**"
      - "scripts/ci/receivable155/**"
      - "scripts/ci/pricing-container/**"
      - "scripts/ci/leads-scope/**"
      - "scripts/ci/test-catalog.*"
      - "scripts/ci/test-catalog/**"
      - "scripts/ci/run-rls-suites.sh"
      - "scripts/ci/run-guards.sh"
      - "scripts/ci/concurrencia-cotizacion-ganadora.sh"
      - "scripts/ci/concurrencia-factura-manual.sh"
      - "scripts/ci/concurrencia-cobro.sh"
      - "scripts/ci/fixtures/**"
      - "scripts/db/**"
      - ".github/actions/setup-pg-client/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinneado por digest para evitar drift entre runs. Equivale a postgres:17.9.
  # IMPORTANTE: al subir esta imagen hay que subir también la mayor del cliente
  # en .github/actions/setup-pg-client (input `version`, hoy 17).
  POSTGRES_IMAGE: postgres@sha256:66b6a97eac1771fc78bd201b918b4253859f436c6913aeede97bd5366cce89ae

jobs:
  rls-tests-result:
    # Nombre visible conservado por compatibilidad con los checks previos
    # (este repo no tiene branch protection ni rulesets configurados).
    name: RLS tests result
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres@sha256:66b6a97eac1771fc78bd201b918b4253859f436c6913aeede97bd5366cce89ae
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q
      BASELINE: supabase/schema/baseline.sql
      # Never set this outside the disposable Actions PostgreSQL service.
      SELECTOR148_ISOLATED_CI: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No se hace push/fetch autenticado.
          persist-credentials: false

      - name: Catálogo completo de pruebas
        run: node scripts/ci/test-catalog.mjs --output reports/rls-evidence/inventory.json

      - name: Cliente de Postgres 17 (paridad con la imagen pinneada)
        uses: ./.github/actions/setup-pg-client

      - name: AUD147 comparator — native currency and view compatibility
        timeout-minutes: 3
        # Independent disposable cluster; no access to the main RLS service or network.
        run: |
          docker run --rm --network none --user postgres --entrypoint bash \
            -v "$PWD:/repo:ro" "$POSTGRES_IMAGE" \
            -c 'cd /repo && PG_BIN=/usr/lib/postgresql/17/bin bash scripts/db/audit147-comparador/run.sh'

      - name: Pendiente por embarque — control rojo y linaje fiscal
        env:
          ISOLATED_QA_DB: '1'
        run: bash scripts/ci/receivable155/run-ci.sh

      - name: Dependencia mínima del runner serial selector148
        # Node/npm are provided by ubuntu-24.04; use a separate exact lockfile,
        # no root frontend install and no lifecycle scripts.
        run: |
          node -e "require('node:assert/strict')(Number(process.versions.node.split('.')[0]) >= 20)"
          npm ci --prefix scripts/ci/selector148 --ignore-scripts --omit=optional --no-audit --no-fund
          node scripts/ci/selector148/static-check.cjs

      - name: Validate AUD54 catalog runtime harness syntax
        run: |
          bash -n scripts/ci/rls-prepare-db.sh
          bash -n scripts/ci/audit54-cxc-forward-runtime.sh
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/ci/audit54-cxc-runtime-fixtures.py').read_text(encoding='utf-8'))"

      # Bootstrap + squash (con su inventario) + replay ordenado de TODAS las
      # migraciones posteriores.
      - name: Preparar BD (bootstrap + squash + replay de migraciones)
        env:
          AUD54_CI: '1'
          ISOLATED_QA_DB: '1'
          FINANCIAL49_CI: '1'
          PRICING_CONTAINER_CI: '1'
          LEADS_SCOPE_CI: '1'
        run: bash scripts/ci/rls-prepare-db.sh

      - name: Candado service_role-only en migraciones (bidireccional)
        # Corre DESPUÉS de aplicar migraciones y ANTES del GRANT masivo +
        # re-cierre de _ci_post_migrate.sql.
        run: $PSQL -f supabase/tests/rls/_ci_check_service_role_only.sql

      - name: Pricing RPC exact ACL before harness grants
        run: $PSQL -f supabase/tests/rls/_ci_check_pricing_container_acl.sql

      - name: Post-migrate (drop auth.users FKs para CI)
        run: $PSQL -f supabase/tests/rls/_ci_post_migrate.sql

      - name: Verify RLS coverage
        run: $PSQL -f supabase/tests/rls/_ci_verify_rls.sql

      - name: Guardia de integridad de esquema (bloqueante)
        run: |
          set -euo pipefail
          $PSQL -A -t -f scripts/db/integrity-guard.sql > /tmp/integrity.txt
          filas=$(grep -c . /tmp/integrity.txt || true)
          if [ "$filas" != "0" ]; then
            {
              echo "## ❌ Guardia de integridad de esquema"
              echo ""
              echo '```'
              cat /tmp/integrity.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/integrity.txt
            exit 1
          fi
          echo "## ✅ Guardia de integridad de esquema" >> "$GITHUB_STEP_SUMMARY"

      # La baseline se compara con la BD recién preparada, ANTES de ejecutar
      # guards y suites: aunque sus fixtures son BEGIN…ROLLBACK, el snapshot no
      # debe depender de ellos.
      - name: Baseline de esquema (estado final esperado)
        run: |
          set -uo pipefail
          # pg_dump se ejecuta DENTRO del contenedor de la imagen pinneada: el
          # pg_dump del runner formatea distinto y produciría diffs falsos.
          container=$(docker ps --filter "ancestor=${POSTGRES_IMAGE}" --format '{{.Names}}' | head -1)
          if [ -z "$container" ]; then
            echo "::error::No se encontró el contenedor Postgres (imagen pinneada)."
            exit 1
          fi
          bash scripts/db/schema-snapshot.sh /tmp/schema.actual.sql "$container" || exit 1
          wc -l /tmp/schema.actual.sql
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Falta $BASELINE — genera y confirma la baseline (bun run db:baseline:update)."
            exit 1
          fi
          if diff -u "$BASELINE" /tmp/schema.actual.sql > /tmp/schema.diff; then
            echo "✓ El estado final del esquema coincide con la baseline"
            echo "## ✅ Baseline de esquema sin cambios" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::El esquema resultante NO coincide con $BASELINE"
          head -200 /tmp/schema.diff
          {
            echo "## ❌ Drift de esquema contra la baseline"
            echo ""
            echo "Si el cambio es intencional, regenerá la baseline con \`bun run db:baseline:update\` y committeala."
            echo ""
            echo '```diff'
            head -300 /tmp/schema.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Guards conductuales + schema invariants (manifiesto bloqueante)
        env:
          JOBS: 4
          LOG_DIR: /tmp/guards-logs
        run: bash scripts/ci/run-guards.sh

      # Descubre por patrón TODAS las suites test_rls_*.sql y verifica
      # su aislamiento BEGIN…ROLLBACK antes de ejecutarlas.
      - name: Suites RLS (descubrimiento por patrón)
        env:
          LOG_DIR: .rls-logs
        run: |
          bash scripts/ci/run-rls-suites.sh
          node scripts/ci/test-catalog.mjs --verify-rls .rls-logs/execution.tsv

      - name: Selector148 — instalador, mutaciones y concurrencia serial
        # Serial coverage: supabase/tests/selector148_disabled_gate.sql is the
        # hash-verified copy run by tests/disabled-gate.sql in owned clones
        # before activation and after restoring the disabled state.
        # DDL mutation, activation and committed seeds live only in clones of
        # the pre-selector template, never in the parallel rollback guard pool.
        env:
          SELECTOR148_GUARD_LOG_DIR: /tmp/guards-logs
        run: node scripts/ci/selector148/run.cjs

      - name: Concurrencia de dos sesiones — cotización ganadora única
        # No cabe en una suite BEGIN…ROLLBACK: necesita dos conexiones
        # compitiendo por la misma oportunidad. El script limpia su fixture.
        run: bash scripts/ci/concurrencia-cotizacion-ganadora.sh

      - name: Concurrencia de dos sesiones — cobro bancario idempotente
        env:
          ISOLATED_QA_DB: '1'
        run: bash scripts/ci/concurrencia-cobro.sh

      - name: Concurrencia de dos sesiones — factura manual idempotente
        env:
          ISOLATED_QA_DB: '1'
        run: bash scripts/ci/concurrencia-factura-manual.sh

      - name: Eliminar sólo las bases desechables propias de selector148
        if: always()
        run: node scripts/ci/selector148/control.cjs cleanup

      - name: Subir evidencia de pendiente por embarque
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receivable155-evidence
          path: .receivable155-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Subir evidencia selector148
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selector148-ci-evidence
          path: .selector148-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Subir evidencia de envelopes financieros
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: financial49-envelope-evidence
          path: .financial49-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Subir evidencia de container RPC installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pricing-container-installer
          path: .pricing-container-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Evidencia de controles del instalador de leads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leads-scope-envelope-evidence
          path: .leads-scope-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Evidencia de controles AUD54 CxC
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit54-cxc-forward-runtime-evidence
          path: /tmp/audit54-cxc-forward-runtime/
          if-no-files-found: ignore
          retention-days: 14

      - name: Evidencia compacta del catálogo y ejecución RLS
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-test-inventory-attempt-${{ github.run_attempt }}
          path: |
            reports/rls-evidence/inventory.json
            .rls-logs/execution.tsv
          if-no-files-found: error
          retention-days: 7

      - name: Subir logs y diff (sólo al fallar)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-logs
          path: |
            .rls-logs/
            /tmp/guards-logs/
            /tmp/schema.diff
            /tmp/schema.actual.sql
            /tmp/integrity.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
