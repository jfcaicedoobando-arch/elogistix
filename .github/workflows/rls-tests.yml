name: rls-tests

# Ejecuta las suites SQL de RLS contra un Postgres efímero, validando el
# aislamiento multi-tenant en cada PR que toque la base de datos.
#
# Estrategia:
#   1) Job `rls` prepara la BD (bootstrap + drift + migrations + verify) y
#      sube un pg_dump como artifact.
#   2) Job `rls-suites` (matrix) descarga el dump y lo restaura en su propio
#      Postgres efímero, evitando re-ejecutar todo el bootstrap N veces.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/rls/**"
      - "supabase/tests/*.sql"
      - "supabase/schema/**"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/rls/**"
      - "supabase/tests/*.sql"
      - "supabase/schema/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch:
  schedule:
    # Lunes 06:00 UTC — corre la suite contra `main` aunque no haya PRs
    # para detectar drift de la imagen Postgres o de catálogos seed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: rls-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinneado por digest para evitar drift entre runs.
  # Equivale a postgres:15.8 (linux/amd64).
  POSTGRES_IMAGE: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb

jobs:
  rls:
    name: Prepare RLS database snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false

      - name: Validate matrix covers every test_rls_*.sql
        # Si alguien añade supabase/tests/rls/test_rls_<nuevo>.sql y olvida
        # registrarlo en `matrix.suite`, la suite no se ejecuta y CI pasa en
        # verde. Aquí fallamos explícitamente si hay drift entre archivos y
        # la matriz declarada en este workflow.
        run: |
          set -euo pipefail
          expected=$(find supabase/tests/rls -maxdepth 1 -name 'test_rls_*.sql' -printf '%f\n' \
            | sed -E 's|^test_rls_||; s|\.sql$||' \
            | LC_ALL=C sort)
          # La lista se extrae del propio bloque `matrix.suite` de este workflow
          # para que no exista una copia manual que se desincronice.
          declared=$(awk '
            /^[[:space:]]*suite:[[:space:]]*$/ { capture = 1; next }
            capture && /^[[:space:]]*-[[:space:]]*[A-Za-z0-9_]+[[:space:]]*$/ {
              gsub(/^[[:space:]]*-[[:space:]]*|[[:space:]]*$/, "");
              print; next
            }
            # Líneas en blanco o comentarios no cierran el bloque: sólo lo hace
            # la siguiente clave YAML (evita listas truncadas en silencio).
            capture && /^[[:space:]]*(#.*)?$/ { next }
            capture { capture = 0 }
          ' .github/workflows/rls-tests.yml | LC_ALL=C sort)
          if [ -z "$declared" ]; then
            echo "::error::No se pudo extraer matrix.suite del workflow (¿cambió el formato YAML?)"
            exit 1
          fi
          if ! diff <(echo "$expected") <(echo "$declared") >/dev/null; then
            echo "::error::matrix.suite está desincronizada con los archivos test_rls_*.sql"
            echo "--- esperados (archivos en disco) ---"
            echo "$expected"
            echo "--- declarados (matrix.suite) ---"
            echo "$declared"
            exit 1
          fi
          echo "✓ matrix.suite cubre $(echo "$expected" | wc -l) suites"


      - name: Restore cached snapshot (if any)
        id: snapshot-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .rls-snapshot/db.dump
          # Invalidamos cache cuando cambian migraciones, helpers CI o el
          # propio workflow (pinneo de imagen Postgres incluido).
          # v13.x (GHA-audit A3) — incluye supabase/schema/**: es trigger del
          # workflow y debe invalidar el snapshot igual que las migraciones.
          key: rls-snapshot-pg15.8-${{ hashFiles('supabase/migrations/**', 'supabase/tests/rls/_ci_*.sql', 'supabase/tests/*.sql', 'supabase/schema/**', '.github/workflows/rls-tests.yml') }}

      - name: Bootstrap (stubs auth/storage/cron/net/pgmq)
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: $PSQL -f supabase/tests/rls/_ci_bootstrap.sql

      - name: Drift fixes (tablas/columnas creadas manualmente en prod)
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: $PSQL -f supabase/tests/rls/_ci_drift.sql

      - name: Apply migrations
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          shopt -s nullglob
          # --single-transaction: si una migración falla a la mitad, hace
          # rollback completo del archivo y aborta el loop (ON_ERROR_STOP=1).
          # Evita estado parcial de objetos creados antes del error.
          for f in $(printf '%s\n' supabase/migrations/*.sql | LC_ALL=C sort); do
            base=$(basename "$f")
            echo "▶ $base"
            sed -E \
              -e 's/^[[:space:]]+CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/    PERFORM 1; -- [ci] stubbed \2/I' \
              -e 's/^CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/SELECT 1; -- [ci] stubbed \2/I' \
              "$f" | $PSQL --single-transaction
          done



      - name: Post-migrate (drop auth.users FKs para CI)
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: $PSQL -f supabase/tests/rls/_ci_post_migrate.sql

      - name: Verify RLS coverage
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: $PSQL -f supabase/tests/rls/_ci_verify_rls.sql

      # Q-14b — La guardia de integridad deja de ser exclusiva del deploy gate:
      # bloquea también en cada PR que toque migraciones (la cache se invalida
      # con cualquier cambio en supabase/migrations/**).
      - name: Guardia de integridad de esquema (bloqueante)
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          $PSQL -A -t -f scripts/db/integrity-guard.sql > /tmp/integrity.txt
          filas=$(grep -c . /tmp/integrity.txt || true)
          if [ "$filas" != "0" ]; then
            {
              echo "## ❌ Guardia de integridad de esquema"
              echo ""
              echo '```'
              cat /tmp/integrity.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/integrity.txt
            exit 1
          fi
          echo "## ✅ Guardia de integridad de esquema" >> "$GITHUB_STEP_SUMMARY"



      - name: Dump prepared database
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .rls-snapshot
          # Mantenemos GRANTs (sin --no-privileges) porque las suites RLS
          # ejecutan SELECT/INSERT con `SET ROLE authenticated`; sin grants
          # PostgREST-style en el destino el primer SELECT lanza
          # "permission denied for table …" antes de evaluar las policies.
          # -Z 9: máxima compresión del custom format (~40% menos peso).
          pg_dump --format=custom --no-owner -Z 9 \
            --file=.rls-snapshot/db.dump postgres
          ls -lh .rls-snapshot/

      - name: Upload database snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-db-snapshot
          path: .rls-snapshot/db.dump
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  rls-suites:
    name: RLS suite — ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    needs: rls
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - isolation
          - financiero
          - financiero_critico
          - crm_operacional
          - operaciones
          - org_scope

          - tarifas_y_costeo
          - reg_costeo
          - reg_portales
          - reg_r4_cotizacion_guard
          - reg_r4_pricing
          - roles_no_admin
          - roles_negocio
          - portal_intra_org
          - rpc_provision_organization
          - rpc_financieras
          - rpc_por_rol
          - rpc_smoke_roles
          - tablas_dinero_extra
          - anon_deny_all
          - cross_tenant_mutations
          - policy_linter
          - soft_delete_rpcs
          - storage_objects
          - reportes_multi_tenant


    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false

      - name: Download database snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rls-db-snapshot
          path: .rls-snapshot/

      - name: Create Supabase roles before restore
        # El snapshot incluye policies con `TO authenticated/anon/service_role`;
        # pg_restore falla con "role does not exist" si esos roles no están
        # creados en la BD destino (vanilla Postgres no los trae).
        run: |
          $PSQL <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin') THEN
              CREATE ROLE supabase_storage_admin NOLOGIN;
            END IF;
          END $$;
          SQL

      - name: Restore database snapshot
        run: |
          # pg_restore es ~10x más rápido que rehacer bootstrap+migrations.
          # Restauramos GRANTs (sin --no-privileges) para que SET ROLE
          # authenticated en las suites pueda leer/escribir sus tablas.
          pg_restore --no-owner --dbname=postgres \
            .rls-snapshot/db.dump

      - name: Run RLS suite — ${{ matrix.suite }}
        run: |
          mkdir -p .rls-logs
          set -o pipefail
          $PSQL -f supabase/tests/rls/test_rls_${{ matrix.suite }}.sql \
            2>&1 | tee ".rls-logs/suite-${{ matrix.suite }}.log"

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-suite-log-${{ matrix.suite }}
          path: .rls-logs/suite-${{ matrix.suite }}.log
          if-no-files-found: warn
          retention-days: 7

  rls-guards:
    name: Guards conductuales + schema invariants (siempre)
    runs-on: ubuntu-24.04
    needs: rls
    timeout-minutes: 10
    # v13.x (GHA-audit A3) — estos guards estaban condicionados a
    # `cache-hit != 'true'` en el job `rls`: con snapshot cacheado el PR quedaba
    # verde sin ejecutarlos. Aqui corren SIEMPRE sobre el dump restaurado
    # (sus fixtures son BEGIN...ROLLBACK, asi que no contaminan nada).

    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download database snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rls-db-snapshot
          path: .rls-snapshot/

      - name: Create Supabase roles before restore
        run: |
          $PSQL <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin') THEN
              CREATE ROLE supabase_storage_admin NOLOGIN;
            END IF;
          END $$;
          SQL

      - name: Restore database snapshot
        run: pg_restore --no-owner --dbname=postgres .rls-snapshot/db.dump

      - name: Verify schema invariants (triggers/functions esperados)
        run: $PSQL -f supabase/tests/schema-invariants.sql

      - name: CxP guard - tests conductuales de sobrepago (FIX-R3-01)
        run: $PSQL -f supabase/tests/cxp_guard_sobrepago.sql

      - name: FIX-45 - whitelist de EXECUTE para anon
        run: $PSQL -f supabase/tests/fix45_anon_execute_whitelist.sql

      - name: Aging CxP - paridad NC soft-deleted (FIX-AGING-NC-01)
        run: $PSQL -f supabase/tests/aging_nc_deleted_at.sql

      - name: CxC guard - tests conductuales de sobrepago
        run: $PSQL -f supabase/tests/cxc_guard_sobrepago.sql

      - name: Conversion de moneda - convertir_monto_pago_a_factura
        run: $PSQL -f supabase/tests/convertir_monto_pago.sql

      - name: Guard de estados - guard_estado_factura
        run: $PSQL -f supabase/tests/guard_estado_factura.sql

      - name: Guard de estados - guard_estado_cotizacion (C5 + A3)
        run: $PSQL -f supabase/tests/guard_estado_cotizacion.sql

      - name: Integridad transaccional - ola6 RPCs atomicas (A3, M3, M4, M15)
        run: $PSQL -f supabase/tests/ola6_transaccional.sql

      - name: Ola 4 ALTAS - tenancy de RPCs (N6, N12)
        run: $PSQL -f supabase/tests/ola4_altas.sql

      - name: Ola 4 ALTAS - reportes financieros (N7, N8, N9, N10)
        run: $PSQL -f supabase/tests/ola4_altas_finanzas.sql

      - name: Ola 4 ALTAS - indices unicos vivos (N15, N16)
        run: $PSQL -f supabase/tests/ola4_altas_indices.sql




  types-drift:
    name: Drift types.ts (esquema <-> tipos TS)
    runs-on: ubuntu-24.04
    needs: rls
    timeout-minutes: 10
    # v13.x (GHA-audit C6) — radar: el esquema fuente de verdad son las
    # migraciones. Arranca en modo aviso (continue-on-error) porque la baseline
    # committeada se genero contra la BD de produccion; una vez regenerada con
    # `bun run gen:types` se puede volver bloqueante quitando continue-on-error.
    continue-on-error: true

    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Download database snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rls-db-snapshot
          path: .rls-snapshot/

      - name: Create Supabase roles before restore
        run: |
          $PSQL <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin') THEN
              CREATE ROLE supabase_storage_admin NOLOGIN;
            END IF;
          END $$;
          SQL

      - name: Restore database snapshot
        run: pg_restore --no-owner --dbname=postgres .rls-snapshot/db.dump

      - name: Regenerate types from migration schema
        id: gentypes
        run: |
          # `supabase gen types` corre postgres-meta en Docker: public.ecr.aws
          # devuelve `toomanyrequests: Rate exceeded` de forma intermitente.
          # Reintentamos con backoff y, si sigue fallando, marcamos el paso como
          # no concluyente (infra) en vez de reportar drift falso.
          IMG="public.ecr.aws/supabase/postgres-meta:v0.96.6"
          for i in 1 2 3 4; do
            if docker pull "$IMG"; then
              echo "imagen postgres-meta lista (intento $i)"
              break
            fi
            if [ "$i" = "4" ]; then
              echo "::warning::No se pudo descargar $IMG (rate limit del registry). Se omite la verificación de drift de types.ts."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 20))
          done

          for i in 1 2 3; do
            if bunx supabase gen types typescript \
                 --db-url postgresql://postgres:postgres@localhost:5432/postgres \
                 --schema public > /tmp/types.generated.ts; then
              wc -l /tmp/types.generated.ts
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 15))
          done

          echo "::warning::supabase gen types falló tras 3 intentos (infra). Se omite la verificación de drift de types.ts."
          echo "skipped=true" >> "$GITHUB_OUTPUT"

      - name: Diff against committed types.ts
        if: steps.gentypes.outputs.skipped != 'true'
        run: |
          # `__InternalSupabase` (PostgrestVersion) y las funciones de
          # extensiones (pgcrypto/uuid-ossp/pg_trgm, que en CI caen en `public`)
          # no son drift de esquema: se filtran en ambos lados.
          bun scripts/ci/normalize-supabase-types.ts src/integrations/supabase/types.ts > /tmp/types.committed.norm.ts
          bun scripts/ci/normalize-supabase-types.ts /tmp/types.generated.ts > /tmp/types.generated.norm.ts

          if ! diff -u /tmp/types.committed.norm.ts /tmp/types.generated.norm.ts > /tmp/types.diff; then
            echo "::warning::src/integrations/supabase/types.ts esta STALE respecto al esquema de migraciones."
            echo "::warning::Regenera con: DATABASE_URL=<bd-local-con-migraciones> bun run gen:types"
            head -120 /tmp/types.diff
            {
              echo "## Drift de types.ts"
              echo ""
              echo '```diff'
              head -200 /tmp/types.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "types.ts sincronizado con el esquema de migraciones"


  schema-baseline:
    name: Baseline de esquema (estado final esperado)
    runs-on: ubuntu-24.04
    needs: rls
    timeout-minutes: 10
    # El drift radar prueba que las migraciones APLIQUEN; este job prueba que el
    # estado final sea EXACTAMENTE el esperado. Cubre lo que ninguna otra suite
    # ve: un índice borrado, un CHECK relajado, un GRANT abierto de más, un
    # trigger eliminado o el cuerpo de una RPC cambiado sin querer.
    # Se actualiza a propósito con: bun run db:baseline:update

    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q
      BASELINE: supabase/schema/baseline.sql

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download database snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rls-db-snapshot
          path: .rls-snapshot/

      - name: Create Supabase roles before restore
        run: |
          $PSQL <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN
              CREATE ROLE authenticator NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_storage_admin') THEN
              CREATE ROLE supabase_storage_admin NOLOGIN;
            END IF;
          END $$;
          SQL

      - name: Restore database snapshot
        run: pg_restore --no-owner --dbname=postgres .rls-snapshot/db.dump

      - name: Generate normalized schema snapshot
        run: |
          set -euo pipefail
          # pg_dump se ejecuta DENTRO del contenedor de la imagen pinneada:
          # el pg_dump del runner (v16) formatea distinto al del servidor (15.8)
          # y produciría diffs falsos contra la baseline generada en local.
          container=$(docker ps --filter "ancestor=${POSTGRES_IMAGE}" --format '{{.Names}}' | head -1)
          if [ -z "$container" ]; then
            echo "::error::No se encontró el contenedor Postgres (imagen pinneada)."
            exit 1
          fi
          bash scripts/db/schema-snapshot.sh /tmp/schema.actual.sql "$container"
          wc -l /tmp/schema.actual.sql

      - name: Upload generated snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-snapshot-actual
          path: /tmp/schema.actual.sql
          if-no-files-found: warn
          retention-days: 7

      - name: Compare against committed baseline
        run: |
          set -uo pipefail
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Falta $BASELINE. Genérala una vez con: bun run db:baseline:update"
            {
              echo "## ❌ Baseline de esquema ausente"
              echo ""
              echo "Este repo aún no tiene \`$BASELINE\`. Generala en local con:"
              echo ""
              echo '```sh'
              echo 'bun run db:baseline:update'
              echo '```'
              echo ""
              echo "O descargá el artifact \`schema-snapshot-actual\` de este run y committealo en esa ruta."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if diff -u "$BASELINE" /tmp/schema.actual.sql > /tmp/schema.diff; then
            echo "✓ El estado final del esquema coincide con la baseline"
            echo "## ✅ Baseline de esquema sin cambios" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::El esquema resultante NO coincide con $BASELINE"
          head -200 /tmp/schema.diff
          {
            echo "## ❌ Drift de esquema contra la baseline"
            echo ""
            echo "Si el cambio es intencional, regenerá la baseline con \`bun run db:baseline:update\` y committeala."
            echo ""
            echo '```diff'
            head -300 /tmp/schema.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload schema diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-baseline-diff
          path: /tmp/schema.diff
          if-no-files-found: ignore
          retention-days: 7



  rls-tests-result:
    name: RLS tests result
    runs-on: ubuntu-24.04
    needs: [rls-suites, rls-guards]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:

      - name: Detallar suites fallidas
        # El resultado agregado sólo dice "failure": sin esto hay que abrir a
        # mano las 19 suites para saber cuál rompió. Aquí listamos las suites
        # fallidas con su enlace directo, en el log y en el summary.
        if: needs.rls-suites.result != 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100 },
            );
            const fallidas = jobs.filter(
              (j) => j.name.startsWith('RLS suite —') && j.conclusion !== 'success' && j.conclusion !== 'skipped',
            );
            const lineas = fallidas.length
              ? fallidas.map((j) => `- **${j.name.replace('RLS suite — ', '')}** (${j.conclusion}) → ${j.html_url}`)
              : ['- (no se pudo identificar la suite; revisa los artifacts `rls-suite-log-*`)'];
            for (const l of lineas) core.error(l);
            core.summary.addRaw(`## ❌ Suites RLS fallidas\n${lineas.join('\n')}\n`);
            await core.summary.write();

      - name: Aggregate matrix result
        # Job único para usar como required check en branch protection,
        # evitando tener que listar las 19 suites individualmente.
        run: |
          suites="${{ needs.rls-suites.result }}"
          guards="${{ needs.rls-guards.result }}"
          baseline="${{ needs.schema-baseline.result }}"
          echo "rls-suites result: $suites"
          echo "rls-guards result: $guards"
          echo "schema-baseline result: $baseline"
          fail=0
          [ "$suites" = "success" ] || fail=1
          [ "$guards" = "success" ] || fail=1
          [ "$baseline" = "success" ] || fail=1
          if [ "$fail" = "1" ]; then
            echo "::error::Una o más suites RLS, guards conductuales o la baseline de esquema fallaron"
            exit 1
          fi
          echo "✓ Suites RLS, guards conductuales y baseline de esquema en verde"




  migration-clean-apply:
    name: Drift radar — migraciones sin _ci_drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Sólo falla con drift NUEVO (migraciones posteriores al corte histórico).
    # La deuda anterior al corte se reporta como notice, no como warning.


    services:
      postgres:
        image: postgres@sha256:2c0d947901cfeaee8121e4f2f60fc55a4d1d6835708a21c9c70fec8eaf3f3dcb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Bootstrap (stubs auth/storage/cron/net/pgmq)
        run: $PSQL -f supabase/tests/rls/_ci_bootstrap.sql

      - name: Apply migrations SIN parches de drift
        id: apply
        env:
          # Corte histórico: todo lo anterior es deuda congelada (se informa,
          # no rompe). Todo lo posterior DEBE aplicar sobre una base limpia.
          #
          # 20260729040000 mueve el corte por encima de 20260729035825 (FIX C5),
          # que parchea por texto definiciones vigentes y no puede aplicar sobre
          # una base reconstruida (su ancla vive en una migración legacy que
          # falla antes). Su estado final lo garantiza, de forma determinista y
          # sin anclas, la migración FIX C5-b posterior al corte.
          DRIFT_CORTE: "20260729040000"

        run: |
          set -uo pipefail
          shopt -s nullglob
          legacy=0
          nuevas=""
          for f in $(printf '%s\n' supabase/migrations/*.sql | LC_ALL=C sort); do
            base=$(basename "$f")
            if ! sed -E \
              -e 's/^[[:space:]]+CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/    PERFORM 1; -- [ci] stubbed \2/I' \
              -e 's/^CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/SELECT 1; -- [ci] stubbed \2/I' \
              "$f" | $PSQL --single-transaction > /tmp/mig.log 2>&1; then
              if [[ "${base%%_*}" < "$DRIFT_CORTE" ]]; then
                legacy=$((legacy + 1))
                echo "- \`$base\`" >> /tmp/legacy.md
              else
                echo "::error file=$f::drift NUEVO — la migración no aplica en una base limpia"
                echo "--- últimas 20 líneas de $base ---"
                tail -n 20 /tmp/mig.log
                nuevas="$nuevas $base"

              fi
            fi
          done
          {
            echo "## Drift radar — migraciones aplicadas en limpio"
            echo ""
            if [ -n "$nuevas" ]; then
              echo "❌ Drift NUEVO (posterior al corte $DRIFT_CORTE):"
              for m in $nuevas; do echo "- \`$m\`"; done
              echo ""
              echo "Acción: escribir la migración real que cree esas columnas/tablas."
            else
              echo "✓ Sin drift nuevo. Nada posterior al corte $DRIFT_CORTE quedó fuera del historial."
            fi
            if [ "$legacy" -gt 0 ]; then
              echo ""
              echo "<details><summary>Deuda histórica congelada ($legacy migraciones previas al corte)</summary>"
              echo ""
              cat /tmp/legacy.md
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$nuevas" ]

