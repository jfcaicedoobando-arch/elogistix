name: rls-tests

# Suites SQL de RLS + guardas de base de datos contra un Postgres efímero.
#
# CI simplificado (YAGNI): UN job, UNA instancia Postgres, sin matrix, sin
# snapshot cacheado ni transporte de dumps entre jobs, sin radar de types.ts ni
# guards RADAR no bloqueantes, sin cron.
#
# Orden intencional:
#   bootstrap → squash + replay ordenado → candado service_role-only →
#   post-migrate → verify RLS → integrity guard → baseline de esquema
#   (ANTES de cualquier fixture) → guards del manifiesto → suites RLS →
#   concurrencia de cotización ganadora.
#
# Fail-closed: si el bootstrap o la preparación falla, el job falla y el
# required check "RLS tests result" queda rojo.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/schema/**"
      - "scripts/ci/rls-prepare-db.sh"
      - "scripts/ci/run-rls-suites.sh"
      - "scripts/ci/run-guards.sh"
      - "scripts/ci/concurrencia-cotizacion-ganadora.sh"
      - "scripts/db/**"
      - ".github/actions/setup-pg-client/**"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/schema/**"
      - "scripts/ci/rls-prepare-db.sh"
      - "scripts/ci/run-rls-suites.sh"
      - "scripts/ci/run-guards.sh"
      - "scripts/ci/concurrencia-cotizacion-ganadora.sh"
      - "scripts/db/**"
      - ".github/actions/setup-pg-client/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinneado por digest para evitar drift entre runs. Equivale a postgres:17.9.
  # IMPORTANTE: al subir esta imagen hay que subir también la mayor del cliente
  # en .github/actions/setup-pg-client (input `version`, hoy 17).
  POSTGRES_IMAGE: postgres@sha256:66b6a97eac1771fc78bd201b918b4253859f436c6913aeede97bd5366cce89ae

jobs:
  rls-tests-result:
    # Nombre visible estable: es el required check en branch protection.
    name: RLS tests result
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres@sha256:66b6a97eac1771fc78bd201b918b4253859f436c6913aeede97bd5366cce89ae
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --shm-size=256m

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q
      BASELINE: supabase/schema/baseline.sql

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No se hace push/fetch autenticado.
          persist-credentials: false

      - name: Cliente de Postgres 17 (paridad con la imagen pinneada)
        uses: ./.github/actions/setup-pg-client

      # Bootstrap + squash (con su inventario) + replay ordenado de TODAS las
      # migraciones posteriores.
      - name: Preparar BD (bootstrap + squash + replay de migraciones)
        run: bash scripts/ci/rls-prepare-db.sh

      - name: Candado service_role-only en migraciones (bidireccional)
        # Corre DESPUÉS de aplicar migraciones y ANTES del GRANT masivo +
        # re-cierre de _ci_post_migrate.sql.
        run: $PSQL -f supabase/tests/rls/_ci_check_service_role_only.sql

      - name: Post-migrate (drop auth.users FKs para CI)
        run: $PSQL -f supabase/tests/rls/_ci_post_migrate.sql

      - name: Verify RLS coverage
        run: $PSQL -f supabase/tests/rls/_ci_verify_rls.sql

      - name: Guardia de integridad de esquema (bloqueante)
        run: |
          set -euo pipefail
          $PSQL -A -t -f scripts/db/integrity-guard.sql > /tmp/integrity.txt
          filas=$(grep -c . /tmp/integrity.txt || true)
          if [ "$filas" != "0" ]; then
            {
              echo "## ❌ Guardia de integridad de esquema"
              echo ""
              echo '```'
              cat /tmp/integrity.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/integrity.txt
            exit 1
          fi
          echo "## ✅ Guardia de integridad de esquema" >> "$GITHUB_STEP_SUMMARY"

      # La baseline se compara con la BD recién preparada, ANTES de ejecutar
      # guards y suites: aunque sus fixtures son BEGIN…ROLLBACK, el snapshot no
      # debe depender de ellos.
      - name: Baseline de esquema (estado final esperado)
        run: |
          set -uo pipefail
          # pg_dump se ejecuta DENTRO del contenedor de la imagen pinneada: el
          # pg_dump del runner formatea distinto y produciría diffs falsos.
          container=$(docker ps --filter "ancestor=${POSTGRES_IMAGE}" --format '{{.Names}}' | head -1)
          if [ -z "$container" ]; then
            echo "::error::No se encontró el contenedor Postgres (imagen pinneada)."
            exit 1
          fi
          bash scripts/db/schema-snapshot.sh /tmp/schema.actual.sql "$container" || exit 1
          wc -l /tmp/schema.actual.sql
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Falta $BASELINE — genera y confirma la baseline (bun run db:baseline:update)."
            exit 1
          fi
          if diff -u "$BASELINE" /tmp/schema.actual.sql > /tmp/schema.diff; then
            echo "✓ El estado final del esquema coincide con la baseline"
            echo "## ✅ Baseline de esquema sin cambios" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::El esquema resultante NO coincide con $BASELINE"
          head -200 /tmp/schema.diff
          {
            echo "## ❌ Drift de esquema contra la baseline"
            echo ""
            echo "Si el cambio es intencional, regenerá la baseline con \`bun run db:baseline:update\` y committeala."
            echo ""
            echo '```diff'
            head -300 /tmp/schema.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Guards conductuales + schema invariants (manifiesto bloqueante)
        env:
          JOBS: 4
          LOG_DIR: /tmp/guards-logs
        run: bash scripts/ci/run-guards.sh

      # Descubre por patrón TODAS las suites test_rls_*.sql (34 hoy) y verifica
      # su aislamiento BEGIN…ROLLBACK antes de ejecutarlas.
      - name: Suites RLS (descubrimiento por patrón)
        env:
          LOG_DIR: .rls-logs
        run: bash scripts/ci/run-rls-suites.sh

      - name: Concurrencia de dos sesiones — cotización ganadora única
        # No cabe en una suite BEGIN…ROLLBACK: necesita dos conexiones
        # compitiendo por la misma oportunidad. El script limpia su fixture.
        run: bash scripts/ci/concurrencia-cotizacion-ganadora.sh

      - name: Subir logs y diff (sólo al fallar)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rls-logs
          path: |
            .rls-logs/
            /tmp/guards-logs/
            /tmp/schema.diff
            /tmp/integrity.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
