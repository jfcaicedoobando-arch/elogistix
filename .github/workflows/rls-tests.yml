name: rls-tests

# Ejecuta las suites SQL de RLS contra un Postgres efímero, validando el
# aislamiento multi-tenant en cada PR que toque la base de datos.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/rls/**"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/rls/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Nota: el service `postgres` con --health-cmd ya garantiza readiness
      # antes de que arranque el primer step, así que no necesitamos "Wait for".

      - name: Bootstrap (stubs auth/storage/cron/net/pgmq)
        run: $PSQL -f supabase/tests/rls/_ci_bootstrap.sql

      - name: Drift fixes (tablas/columnas creadas manualmente en prod)
        run: $PSQL -f supabase/tests/rls/_ci_drift.sql

      - name: Apply migrations
        run: |
          shopt -s nullglob
          # Orden determinístico: aunque el glob ya ordena lexicográficamente
          # con timestamps YYYYMMDDHHMMSS_, forzamos LC_ALL=C por defensa.
          for f in $(printf '%s\n' supabase/migrations/*.sql | LC_ALL=C sort); do
            base=$(basename "$f")
            echo "▶ $base"
            # CI no tiene pg_cron / pg_net / pgmq / supabase_vault (sólo existen
            # en Supabase managed Postgres). Reemplazamos los CREATE EXTENSION
            # on-the-fly: en top-level por `SELECT 1;`, dentro de bloques DO
            # (líneas indentadas) por `PERFORM 1;` para que PL/pgSQL no quede
            # con un THEN vacío. Los stubs de cron/net/pgmq en el bootstrap se
            # encargan de que las llamadas posteriores ejecuten como no-op.
            sed -E \
              -e 's/^[[:space:]]+CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/    PERFORM 1; -- [ci] stubbed \2/I' \
              -e 's/^CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/SELECT 1; -- [ci] stubbed \2/I' \
              "$f" | $PSQL
          done

      - name: Post-migrate (drop auth.users FKs para CI)
        run: $PSQL -f supabase/tests/rls/_ci_post_migrate.sql

      - name: Verify RLS coverage
        run: $PSQL -f supabase/tests/rls/_ci_verify_rls.sql

  rls-suites:
    runs-on: ubuntu-latest
    needs: rls
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - isolation
          - financiero
          - financiero_critico
          - crm_operacional
          - operaciones
          - tarifas_y_costeo

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PSQL: psql -v ON_ERROR_STOP=1 -X -q

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Bootstrap + drift + migrations
        run: |
          $PSQL -f supabase/tests/rls/_ci_bootstrap.sql
          $PSQL -f supabase/tests/rls/_ci_drift.sql
          shopt -s nullglob
          for f in $(printf '%s\n' supabase/migrations/*.sql | LC_ALL=C sort); do
            sed -E \
              -e 's/^[[:space:]]+CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/    PERFORM 1; -- [ci] stubbed \2/I' \
              -e 's/^CREATE EXTENSION[[:space:]]+(IF NOT EXISTS[[:space:]]+)?(pg_cron|pg_net|pgmq|supabase_vault)[^;]*;/SELECT 1; -- [ci] stubbed \2/I' \
              "$f" | $PSQL
          done
          $PSQL -f supabase/tests/rls/_ci_post_migrate.sql

      - name: Run RLS suite — ${{ matrix.suite }}
        run: $PSQL -f supabase/tests/rls/test_rls_${{ matrix.suite }}.sql


