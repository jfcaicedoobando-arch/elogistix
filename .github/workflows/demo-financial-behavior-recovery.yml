name: Demo financial synthetic behavior recovery
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['codex/demo-financial-compile-recovery-20261015']
    paths:
      - 'scripts/ci/demo-financial-behavior-recovery/**'
      - '.github/workflows/demo-financial-behavior-recovery.yml'
permissions:
  contents: read
concurrency:
  group: demo-financial-behavior-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  synthetic-behavior:
    if: github.repository == 'jfcaicedoobando-arch/elogistix' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/demo-financial-behavior-recovery-20261015' && github.event.pull_request.base.sha == 'c3a593c94f236aab01c887728c07748eb6912cae'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Offline frozen-source and behavior harness tests
        run: |
          python3 -B -I -m unittest discover -s scripts/ci/demo-financial-compile-recovery -p 'test_*.py' -v
          python3 -B -I -m unittest discover -s scripts/ci/demo-financial-behavior-recovery -p 'test_*.py' -v
      - name: Authentic materialization, strict replay and five independent rollback probes
        run: python3 -B -I scripts/ci/demo-financial-behavior-recovery/run_ci.py --suite all --output "$RUNNER_TEMP/demo-financial-behavior-recovery"
      - name: Preserve bounded behavior evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-financial-behavior-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-financial-behavior-recovery/public/**
          if-no-files-found: warn
          retention-days: 14
