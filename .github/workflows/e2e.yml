name: E2E (Playwright)

# Smoke E2E para los 5 flujos críticos. Se ejecuta:
#  - manualmente (workflow_dispatch)
#  - nightly diario 06:00 UTC (00:00 CDMX)
#  - semanalmente, lunes 09:00 UTC (03:00 CDMX) — kept para histórico semanal
# No bloquea PRs. Si faltan secrets, el job se marca como skipped.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner != '' }}
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
      E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
    steps:
      - name: Guard — required secrets present
        id: guard
        run: |
          if [ -z "${E2E_BASE_URL}" ] || [ -z "${E2E_EMAIL}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E secrets missing — skipping run."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.guard.outputs.missing == 'false'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.missing == 'false'
        with:
          bun-version: "1.x"

      - name: Cache bun dependencies
        if: steps.guard.outputs.missing == 'false'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.guard.outputs.missing == 'false'
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.guard.outputs.missing == 'false'
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: steps.guard.outputs.missing == 'false'
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright specs
        if: steps.guard.outputs.missing == 'false'
        run: bunx playwright test

      - name: Upload HTML report
        if: ${{ steps.guard.outputs.missing == 'false' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces & videos
        if: ${{ steps.guard.outputs.missing == 'false' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14