name: E2E (Playwright)

# Corridas automáticas de la suite Playwright contra staging.
#
# Triggers (CI simplificado):
#   - workflow_dispatch  → manual (con opción de override de E2E_BASE_URL).
#   - schedule diario    → 12:30 UTC (06:30 CDMX).
#
# Estrategia:
#   - `internal-shard` (matrix 1..3): specs read-only del project `chromium-internal`
#     en paralelo con `--shard`.
#   - `mutators`: specs 09-12 en `chromium-mutators` con workers: 1 (single job).
#   - `portal`: specs del project `chromium-portal`.
#   - `merge-reports`: junta los blob reports y publica el HTML unificado.
#   - `notify-failure`: abre/actualiza issue si algún shard reporta regresión.
#
# Fail on regression: cada bunx playwright test devuelve exit != 0 → job falla →
# `merge-reports.needs` marca el workflow como failed y `notify-failure` corre.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override de E2E_BASE_URL (opcional; default = secret)"
        required: false
        type: string
      strict_fixtures:
        description: "Si '1', los specs con fixtures ausentes fallan (no skip)."
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
  E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
  E2E_CROSS_ORG_EMBARQUE_ID: ${{ secrets.E2E_CROSS_ORG_EMBARQUE_ID }}
  E2E_CROSS_ORG_FACTURA_ID: ${{ secrets.E2E_CROSS_ORG_FACTURA_ID }}
  E2E_CROSS_ORG_COTIZACION_ID: ${{ secrets.E2E_CROSS_ORG_COTIZACION_ID }}
  E2E_PROVISION_SECRET: ${{ secrets.E2E_PROVISION_SECRET }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  E2E_BLOB: "1"
  # v13.312.15 — Exponemos las variables gating de specs 07–12/25 y multi-tenant
  # (26) para que, si el proyecto de staging registra los secrets, los specs
  # dejen de saltarse silenciosamente. Si el secret está vacío el spec skipea
  # con el motivo original (test.skip(!X, "…")). Ninguna se marca `required`
  # aquí para no romper el workflow cuando el tenant todavía no los tiene.
  E2E_HAS_SEED: ${{ secrets.E2E_HAS_SEED }}
  E2E_FISCAL: ${{ secrets.E2E_FISCAL }}
  E2E_PROFORMA_NUMERO: ${{ secrets.E2E_PROFORMA_NUMERO }}
  E2E_HAS_AUDIT_DATA: ${{ secrets.E2E_HAS_AUDIT_DATA }}
  E2E_ADMIN_ORG: ${{ secrets.E2E_ADMIN_ORG }}
  E2E_EMBARQUE_CHECKLIST_INCOMPLETO_ID: ${{ secrets.E2E_EMBARQUE_CHECKLIST_INCOMPLETO_ID }}
  E2E_COTIZACION_ACEPTADA_ID: ${{ secrets.E2E_COTIZACION_ACEPTADA_ID }}
  E2E_PROVEEDOR_ID: ${{ secrets.E2E_PROVEEDOR_ID }}
  E2E_EMBARQUE_PARA_CXP_ID: ${{ secrets.E2E_EMBARQUE_PARA_CXP_ID }}
  # Multi-tenant (spec 26 — corre en el job `multi-tenant`).
  E2E_MT_A_EMAIL: ${{ secrets.E2E_MT_A_EMAIL }}
  E2E_MT_A_PASSWORD: ${{ secrets.E2E_MT_A_PASSWORD }}
  E2E_MT_B_EMAIL: ${{ secrets.E2E_MT_B_EMAIL }}
  E2E_MT_B_PASSWORD: ${{ secrets.E2E_MT_B_PASSWORD }}
  # Cuando E2E_STRICT_FIXTURES=1, `requireFixture()` de testBase promueve los
  # skips por fixture ausente a fallo (ver `e2e/fixtures/requireFixture.ts`).
  # En CI lo dejamos apagado por default; se activa vía dispatch input.
  E2E_STRICT_FIXTURES: ${{ github.event.inputs.strict_fixtures || '' }}

jobs:
  guard-secrets:
    name: Guard (E2E secrets)
    runs-on: ubuntu-24.04
    # El workflow sólo corre por schedule o dispatch manual (ramas internas),
    # así que los secrets del environment e2e-staging nunca se exponen a forks.
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      mt_ok: ${{ steps.check.outputs.mt_ok }}
    steps:
      - id: check
        # v13.x (GHA-audit M8/A1) — antes sólo validaba 3 secretos y el resto
        # skipeaba en silencio. Ahora valida todos los grupos requeridos y
        # FALLA en corridas agendadas/encadenadas (verde vacío prohibido).
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          core_missing=""
          for v in E2E_BASE_URL E2E_EMAIL E2E_PASSWORD \
                   E2E_PORTAL_EMAIL E2E_PORTAL_PASSWORD \
                   E2E_PROVISION_SECRET \
                   VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && core_missing="$core_missing $v"
          done
          mt_missing=""
          for v in E2E_MT_A_EMAIL E2E_MT_A_PASSWORD E2E_MT_B_EMAIL E2E_MT_B_PASSWORD; do
            eval "val=\${$v:-}"
            [ -z "$val" ] && mt_missing="$mt_missing $v"
          done
          scheduled=0
          [ "$EVENT_NAME" = "schedule" ] && scheduled=1
          if [ -n "$core_missing" ]; then
            if [ "$scheduled" = "1" ]; then
              echo "::error::E2E secrets ausentes en corrida agendada:$core_missing — la suite NO corrió (verde vacío prohibido)."
              exit 1
            fi
            echo "::warning::E2E secrets missing:$core_missing — skipping run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$mt_missing" ]; then
            if [ "$scheduled" = "1" ]; then
              echo "::error::E2E_MT_* secrets ausentes en corrida agendada:$mt_missing — el job multi-tenant NO corrió."
              exit 1
            fi
            echo "::warning::E2E_MT_* missing:$mt_missing — se omite multi-tenant."
            echo "mt_ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "mt_ok=true" >> "$GITHUB_OUTPUT"
          fi

  provision-users:
    name: Provisionar usuarios E2E
    needs: [guard-secrets]
    if: needs.guard-secrets.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Guard (provisioning secret)
        id: check
        run: |
          if [ -z "${E2E_PROVISION_SECRET}" ] || [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::warning::E2E_PROVISION_SECRET o VITE_SUPABASE_URL ausente — se omite provisión."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Provisionar admin + portal
        if: steps.check.outputs.skip == 'false'
        run: bun run e2e:provision

  internal-shard:
    name: Internal · shard ${{ matrix.shard }}/3
    needs: [guard-secrets, provision-users]
    if: needs.guard-secrets.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium

      - name: Run internal specs (shard ${{ matrix.shard }}/3)
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=internal-${{ matrix.shard }}-report.json bunx playwright test --project=chromium-internal --shard=${{ matrix.shard }}/3 --grep-invert "@visual" --reporter=blob,json  # @visual fuera de CI hasta commitear baselines (ver spec 27)

      - name: Gate anti-skip — internal-shard debe ejecutar tests reales
        # v13.x (GHA-audit A1) — mismo criterio que mutators: si los specs
        # skippearon en silencio (fixtures/env ausentes) el job quedaba verde
        # con 0 tests. Ahora falla.
        if: always()
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const f = "internal-${{ matrix.shard }}-report.json";
            if (!fs.existsSync(f)) {
              console.error(`::error::${f} no existe — el run de Playwright no produjo reporte.`);
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            const s = r.stats || {};
            const executed = (s.expected||0) + (s.unexpected||0) + (s.flaky||0);
            console.log(`internal shard: executed=${executed} skipped=${s.skipped||0}`);
            if (executed === 0) {
              console.error("::error::0 tests ejecutados en internal-shard — los specs skippearon en silencio.");
              process.exit(1);
            }'

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-internal-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload traces & videos on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-internal-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  mutators:
    name: Mutators (09-12, serial)
    needs: [guard-secrets, provision-users]
    if: needs.guard-secrets.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 20
    # NUNCA correr mutators en paralelo con otro run mutador contra el mismo
    # tenant staging — el orden serial de 09→12 asume DB estable.
    concurrency:
      group: e2e-mutators
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium

      - name: Run mutators
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=mutators-report.json bunx playwright test --project=chromium-mutators --reporter=blob,json

      - name: Gate anti-skip — mutators debe ejecutar tests reales
        # Auditoría de tests 2026-07-24 (H2): los specs 09-12 y 25 hacen
        # test.skip cuando faltan los env IDs/flags que e2e.yml nunca
        # exporta (E2E_FISCAL, E2E_EMBARQUE_*_ID, …) → el job quedaba
        # verde ejecutando 0 tests reales. Si vuelve a pasar, falla.
        if: always()
        run: |
          # shellcheck disable=SC2016
          # Las expresiones ${...} viven dentro del string de node -e y las
          # expande Node, no bash. Silenciamos SC2016 a propósito.
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("mutators-report.json")) {
              console.error("::error::mutators-report.json no existe — el run de Playwright no produjo reporte.");
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync("mutators-report.json", "utf8"));
            const s = r.stats || {};
            const executed = (s.expected||0) + (s.unexpected||0) + (s.flaky||0);
            console.log(`mutators: executed=${executed} skipped=${s.skipped||0}`);
            if (executed === 0) {
              console.error("::error::0 tests ejecutados en mutators — los specs skippearon en silencio (faltan env IDs/seed de staging).");
              process.exit(1);
            }'

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-mutators
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-mutators
          path: test-results/
          retention-days: 14

  portal:
    name: Portal
    needs: [guard-secrets, provision-users]
    if: needs.guard-secrets.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium

      - name: Run portal specs
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=portal-report.json bunx playwright test --project=chromium-portal --reporter=blob,json

      - name: Gate anti-skip — portal debe ejecutar tests reales
        # v13.x (GHA-audit A1) — evita el "verde vacío" con 0 tests reales.
        if: always()
        run: |
          # shellcheck disable=SC2016
          node -e '
            const fs = require("fs");
            const f = "portal-report.json";
            if (!fs.existsSync(f)) {
              console.error(`::error::${f} no existe — el run de Playwright no produjo reporte.`);
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(f, "utf8"));
            const s = r.stats || {};
            const executed = (s.expected||0) + (s.unexpected||0) + (s.flaky||0);
            console.log(`portal: executed=${executed} skipped=${s.skipped||0}`);
            if (executed === 0) {
              console.error("::error::0 tests ejecutados en portal — los specs skippearon en silencio.");
              process.exit(1);
            }'

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-portal
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-portal
          path: test-results/
          retention-days: 14

  multi-tenant:
    name: Multi-tenant isolation (26)
    needs: [guard-secrets, provision-users]
    if: needs.guard-secrets.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    # v13.x (GHA-audit A6) — los secrets E2E viven en el environment
    # e2e-staging: sólo los jobs que ejecutan tests/guards los reciben.
    environment: e2e-staging
    timeout-minutes: 15
    # Serial: usa dos orgs dedicadas y no debe intercalarse con otras corridas.
    concurrency:
      group: e2e-multi-tenant
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Guard (multi-tenant secrets)
        id: mt_check
        # v13.x (GHA-audit M8) — en corridas agendadas/encadenadas falla en vez
        # de skipear: un multi-tenant que no corre no puede reportarse verde.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "${E2E_MT_A_EMAIL}" ] || [ -z "${E2E_MT_A_PASSWORD}" ] || \
             [ -z "${E2E_MT_B_EMAIL}" ] || [ -z "${E2E_MT_B_PASSWORD}" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::error::E2E_MT_* secrets ausentes en corrida agendada — el job multi-tenant NO corrió."
              exit 1
            fi
            echo "::warning::E2E_MT_* secrets missing — se omite el job multi-tenant."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        if: steps.mt_check.outputs.skip == 'false'
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        if: steps.mt_check.outputs.skip == 'false' && steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium
      - name: Install Playwright system deps
        if: steps.mt_check.outputs.skip == 'false'
        run: bunx playwright install-deps chromium

      - name: Provisionar orgs A/B + fixture e2e/.tmp/multi-tenant.json
        if: steps.mt_check.outputs.skip == 'false'
        run: bun run e2e:provision-multi-tenant

      - name: Run multi-tenant specs
        if: steps.mt_check.outputs.skip == 'false'
        run: bunx playwright test --project=chromium-multi-tenant

      - name: Upload blob report
        if: always() && steps.mt_check.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-multi-tenant
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload traces on failure
        if: failure() && steps.mt_check.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-multi-tenant
          path: test-results/
          retention-days: 14

  merge-reports:
    name: Merge HTML report
    needs: [internal-shard, mutators, portal, multi-tenant]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun

      - name: Gate global anti-skip (corridas agendadas)
        # v13.x (GHA-audit A1/M8) — en corridas agendadas ningún job de tests
        # puede quedar `skipped`: sería un verde sin cobertura real.
        if: github.event_name == 'schedule'
        env:
          R_INTERNAL: ${{ needs.internal-shard.result }}
          R_MUTATORS: ${{ needs.mutators.result }}
          R_PORTAL: ${{ needs.portal.result }}
          R_MT: ${{ needs.multi-tenant.result }}
        run: |
          fail=0
          for pair in "internal-shard:$R_INTERNAL" "mutators:$R_MUTATORS" "portal:$R_PORTAL" "multi-tenant:$R_MT"; do
            job="${pair%%:*}"; res="${pair#*:}"
            echo "$job: $res"
            if [ "$res" = "skipped" ]; then
              echo "::error::$job quedó SKIPPED en una corrida agendada — verde vacío prohibido."
              fail=1
            fi
          done
          [ "$fail" = "0" ]

      - name: Download all blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML
        run: bunx playwright merge-reports --reporter=html ./all-blob-reports || echo "no blob reports"

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if any test job failed
        # Explicit gate: si algún shard falló, este job también falla para que
        # notify-failure dispare y el workflow quede rojo (regresión).
        if: ${{ needs.internal-shard.result == 'failure' || needs.mutators.result == 'failure' || needs.portal.result == 'failure' || needs.multi-tenant.result == 'failure' }}
        run: |
          echo "::error::Se detectaron regresiones en E2E."
          echo "internal-shard=${{ needs.internal-shard.result }}"
          echo "mutators=${{ needs.mutators.result }}"
          echo "portal=${{ needs.portal.result }}"
          echo "multi-tenant=${{ needs.multi-tenant.result }}"
          exit 1

  notify-failure:
    name: Notificar regresión E2E (issue)
    needs: [merge-reports]
    # Solo en runs agendados (no en dispatch manual).
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Crear o actualizar issue de regresión
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const label = 'e2e-regression';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🧪 E2E Playwright falló en staging (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `El workflow **E2E (Playwright)** detectó una regresión contra staging.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- SHA: \`${context.sha}\``,
              ``,
              `Artefactos disponibles:`,
              `- \`playwright-report\` — reporte HTML unificado (mergeado de todos los shards)`,
              `- \`traces-*\` — trazas y videos por shard fallido`,
              ``,
              `Revisar en orden: internal-shard-1..3, mutators, portal.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
