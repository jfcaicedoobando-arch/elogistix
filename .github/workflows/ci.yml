name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unused code & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Unused code check (knip)
        run: bun run lint:unused

      - name: Strict unused exports & types (informational)
        if: always()
        continue-on-error: true
        run: bun run lint:unused:strict

      - name: Test hygiene (no skip/only/todo, no duplicate titles)
        run: bun run audit:tests

      - name: Architecture & cast report
        if: always()
        run: bun run audit:report

      - name: PR summary (audit report)
        if: always() && github.event_name == 'pull_request'
        run: cat reports/audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: |
            reports/audit-report.md
            reports/audit-report.json
          retention-days: 30

      - name: Build
        run: bun run build

  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests + coverage (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: bun run test:coverage:shard -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=verbose --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          retention-days: 1

  coverage:
    name: Coverage merge & report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard blobs
        uses: actions/download-artifact@v7
        with:
          pattern: vitest-blob-*
          path: .vitest-reports/
          merge-multiple: true

      - name: Merge reports + coverage thresholds
        run: bun run test:coverage:merge

      - name: Coverage report (markdown)
        if: always()
        run: bun run coverage:report || true

      - name: PR summary (coverage)
        if: always() && github.event_name == 'pull_request'
        run: test -f reports/coverage-report.md && cat reports/coverage-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            reports/coverage-report.md
          retention-days: 30
