name: CI

# ENSAYO DE 3 SHARDS + LINT/CHECKS EN PARALELO (medición pedida por el usuario).
#
# Son 5 definiciones de job en YAML que se expanden a 7 jobs reales:
#   1. detector        → sólo checkout + diff robusto; expone frontend/edge/database.
#   2. lint            → ESLint (0 warnings). Corre EN PARALELO con checks y shards.
#   3. checks          → typecheck, guards DB condicionales, build, Deno condicional.
#   4. tests (matrix)  → Vitest shard 1, 2 y 3 (sin coverage, sin retries, sin blobs).
#   5. ci-success      → agregador "CI Success (aggregator)", nombre conservado por
#                        compatibilidad con los checks previos (este repo no tiene
#                        branch protection ni rulesets configurados).
#
# Benchmark de referencia (1 job unificado):
#   run 34196983386: 15m44s de espera total, 922s de ejecución acumulada.
# Medición YA VALIDADA de la configuración previa (3 shards, lint dentro de checks):
#   run 34200102375: espera 347s (5m47s), ejecución acumulada 947s (15m47s);
#   Vitest 1426 archivos/8949 tests, Deno 639; lint 134s dentro del job conjunto
#   de 296s (resto 143s + setup Deno 2s).
# La nueva división lint/checks en 2 jobs aún está pendiente de medición; la
# primera corrida del ensayo de 3 shards (unhandled error en shard 2) no se
# registra como éxito.
#
# El workflow SIEMPRE arranca (sin paths-ignore) para que el check agregador
# nunca quede pending; los pasos irrelevantes se omiten explícitamente.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector:
    name: Detectar áreas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      edge: ${{ steps.areas.outputs.edge }}
      database: ${{ steps.areas.outputs.database }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # - pull_request: base.sha vs HEAD.
      # - push a main:  github.event.before vs github.sha.
      # - dispatch / diff ausente o `git diff` fallido: se corre TODO.
      - name: Detectar áreas cambiadas
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$BEFORE_SHA" ;;
          esac
          diff=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # El estado de `git diff` se captura explícitamente: con `set -e` del
            # shell de Actions una asignación fallida abortaría antes del fallback.
            if salida="$(git diff --name-only "$base" "$HEAD_SHA")"; then
              diff="$salida"
            else
              echo "git diff falló: se ejecuta TODO."
            fi
          fi
          if [ -z "$diff" ]; then
            echo "Sin diff utilizable ($EVENT_NAME): se ejecuta TODO."
            {
              echo "frontend=true"
              echo "edge=true"
              echo "database=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$diff"
          frontend=false
          edge=false
          database=false
          # here-string en vez de `printf | grep -q`: sin SIGPIPE con diffs grandes.
          # Cualquier cambio fuera de docs/markdown toca el camino de app.
          if grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$' <<<"$diff"; then
            frontend=true
          fi
          if grep -qE '^supabase/functions/|^deno\.(json|jsonc|lock)$|^\.github/workflows/ci\.yml$|^\.github/actions/setup-bun/' <<<"$diff"; then
            edge=true
          fi
          if grep -qE '^supabase/(migrations|schema|tests|releases)/|^scripts/audit-|^scripts/lib/|^src/constants/appVersion\.ts$|^package\.json$|^bun\.lock$|^\.github/workflows/ci\.yml$|^\.github/actions/setup-bun/' <<<"$diff"; then
            database=true
          fi
          {
            echo "frontend=$frontend"
            echo "edge=$edge"
            echo "database=$database"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: ESLint
    needs: detector
    if: needs.detector.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      # `react-compiler` cuenta warnings como errores: fail-fast real.
      - name: ESLint (max-warnings 0)
        run: bun run lint -- --max-warnings 0

  checks:
    name: Typecheck · guards DB · build · Deno
    needs: detector
    if: >-
      needs.detector.outputs.frontend == 'true' ||
      needs.detector.outputs.edge == 'true' ||
      needs.detector.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: TypeScript typecheck
        if: needs.detector.outputs.frontend == 'true'
        run: bun run typecheck

      # Guard estático de BD: sólo cuando el diff toca migraciones/schema/tests/
      # releases, los scripts de auditoría, appVersion, dependencias o este CI.
      # Bloqueante; sin audit:all, sin reports, sin duplicar audits de frontend
      # (ésos ya corren dentro de Vitest).
      - name: Auditorías estáticas de BD (bloqueantes)
        if: needs.detector.outputs.database == 'true'
        run: |
          bun run audit:manifest
          bun run audit:schema
          bun run audit:schema-functions
          bun run audit:migrations
          bun run audit:replay-mirror
          bun run audit:rpc-sync

      - name: Build (sin ANALYZE)
        if: needs.detector.outputs.frontend == 'true'
        env:
          ANALYZE: "false"
        run: bun run build

      # Edge Functions: sólo si cambia supabase/functions, deno.* o este workflow.
      - name: Setup Deno
        if: needs.detector.outputs.edge == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Paridad con el runtime real de las Edge Functions (Deno 2).
          deno-version: v2.6.x

      - name: Deno tests (con typecheck, excluye smoke)
        if: needs.detector.outputs.edge == 'true'
        # SIN `--no-check`: `deno test` valida también los tipos de las edges.
        run: |
          set -uo pipefail
          readarray -t tests < <(find supabase/functions -name '*_test.ts' ! -name 'smoke_test.ts')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No se encontró ningún test Deno (patrón *_test.ts)."
            exit 1
          fi
          deno test \
            --node-modules-dir=none \
            --allow-env \
            --allow-net \
            --allow-read \
            "${tests[@]}"

  tests:
    name: Vitest shard ${{ matrix.shard }}/3
    needs: detector
    if: needs.detector.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      # Sin coverage, sin blobs/merge/artifacts, sin retries globales.
      - name: Vitest (shard ${{ matrix.shard }}/3)
        run: bun run test -- --shard=${{ matrix.shard }}/3

  ci-success:
    # Nombre visible conservado por compatibilidad con los checks previos
    # (este repo no tiene branch protection ni rulesets configurados).
    name: CI Success (aggregator)
    needs: [detector, lint, checks, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verificar resultados
        env:
          DETECTOR_RESULT: ${{ needs.detector.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          FRONTEND: ${{ needs.detector.outputs.frontend }}
          EDGE: ${{ needs.detector.outputs.edge }}
          DATABASE: ${{ needs.detector.outputs.database }}
        run: |
          set -uo pipefail
          echo "detector=$DETECTOR_RESULT lint=$LINT_RESULT checks=$CHECKS_RESULT tests=$TESTS_RESULT"
          echo "frontend=$FRONTEND edge=$EDGE database=$DATABASE"
          fail=0

          if [ "$DETECTOR_RESULT" != "success" ]; then
            echo "::error::El detector de áreas no terminó en success ($DETECTOR_RESULT)."
            exit 1
          fi
          for v in "$FRONTEND" "$EDGE" "$DATABASE"; do
            case "$v" in
              true|false) ;;
              *) echo "::error::Flag de área inválida: '$v'."; exit 1 ;;
            esac
          done

          if [ "$FRONTEND" = "true" ]; then
            if [ "$LINT_RESULT" != "success" ]; then
              echo "::error::lint debía terminar en success con frontend=true ($LINT_RESULT)."
              fail=1
            fi
          elif [ "$LINT_RESULT" != "skipped" ]; then
            echo "::error::lint debía omitirse sin frontend ($LINT_RESULT)."
            fail=1
          fi

          if [ "$FRONTEND" = "true" ] || [ "$EDGE" = "true" ] || [ "$DATABASE" = "true" ]; then
            if [ "$CHECKS_RESULT" != "success" ]; then
              echo "::error::checks debía terminar en success ($CHECKS_RESULT)."
              fail=1
            fi
          elif [ "$CHECKS_RESULT" != "skipped" ]; then
            echo "::error::checks debía omitirse sin áreas activas ($CHECKS_RESULT)."
            fail=1
          fi

          if [ "$FRONTEND" = "true" ]; then
            if [ "$TESTS_RESULT" != "success" ]; then
              echo "::error::los 3 shards de Vitest debían terminar en success ($TESTS_RESULT)."
              fail=1
            fi
          elif [ "$TESTS_RESULT" != "skipped" ]; then
            echo "::error::tests debía omitirse sin frontend ($TESTS_RESULT)."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "CI OK."
