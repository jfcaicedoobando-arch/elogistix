name: CI

# CI simplificado (YAGNI): UN job, UN checkout, UNA instalación.
# Secuencia: lint (0 warnings) → typecheck → suite Vitest completa → build.
#
# La suite corre SIN coverage, SIN shards y SIN retries globales: sin `--shard`
# `vitest.config.ts` incluye también los guardrails de arquitectura
# (architecture.test.ts, architecture-baseline.test.ts, audit-report,
# audit-casts-classifier), así que se ejecutan exactamente una vez.
#
# El workflow SIEMPRE arranca (sin paths-ignore) para que el required check
# "CI Success (aggregator)" nunca quede pending; los pasos irrelevantes se
# omiten explícitamente según el área tocada por el diff.

