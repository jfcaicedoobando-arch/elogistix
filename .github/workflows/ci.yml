name: CI

# CI simplificado (YAGNI): UN job, UN checkout, UNA instalación.
# Secuencia: lint (0 warnings) → typecheck → suite Vitest completa → build.
#
# La suite corre SIN coverage, SIN shards y SIN retries globales: sin `--shard`
# `vitest.config.ts` incluye también los guardrails de arquitectura
# (architecture.test.ts, architecture-baseline.test.ts, audit-report,
# audit-casts-classifier), así que se ejecutan exactamente una vez.
#
# El workflow SIEMPRE arranca (sin paths-ignore) para que el required check
# "CI Success (aggregator)" nunca quede pending; los pasos irrelevantes se
# omiten explícitamente según el área tocada por el diff.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-success:
    # Nombre visible estable: es el required check en branch protection.
    name: CI Success (aggregator)
    runs-on: ubuntu-24.04
    # Suite completa en un solo runner. 30 min es el margen inicial; se ajusta
    # con la medición real de GitHub.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: el filtro por áreas diffea contra el base del PR
          # o contra el commit previo del push.
          fetch-depth: 0
          # No se hace push/fetch autenticado.
          persist-credentials: false

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      # Filtro por áreas DENTRO del mismo job (sin detector externo, sin cron).
      # - pull_request: base.sha vs HEAD.
      # - push a main:  github.event.before vs github.sha (todos los commits).
      # - dispatch / diff ausente o `git diff` fallido: se corre TODO.
      - name: Detectar áreas cambiadas
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$BEFORE_SHA" ;;
          esac
          diff=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # El estado de `git diff` se captura explícitamente: con `set -e` del
            # shell de Actions una asignación fallida abortaría antes del fallback.
            if salida="$(git diff --name-only "$base" "$HEAD_SHA")"; then
              diff="$salida"
            else
              echo "git diff falló: se ejecuta TODO."
            fi
          fi
          if [ -z "$diff" ]; then
            echo "Sin diff utilizable ($EVENT_NAME): se ejecuta TODO."
            {
              echo "frontend=true"
              echo "edge=true"
              echo "database=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$diff"
          frontend=false
          edge=false
          database=false
          # here-string en vez de `printf | grep -q`: sin SIGPIPE con diffs grandes.
          # Cualquier cambio fuera de docs/markdown toca el camino de app.
          if grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$' <<<"$diff"; then
            frontend=true
          fi
          if grep -qE '^supabase/functions/|^deno\.(json|jsonc|lock)$|^\.github/workflows/ci\.yml$|^\.github/actions/setup-bun/' <<<"$diff"; then
            edge=true
          fi
          if grep -qE '^supabase/(migrations|schema|tests|releases)/|^scripts/audit-|^scripts/lib/|^src/constants/appVersion\.ts$|^package\.json$|^bun\.lock$|^\.github/workflows/ci\.yml$|^\.github/actions/setup-bun/' <<<"$diff"; then
            database=true
          fi
          {
            echo "frontend=$frontend"
            echo "edge=$edge"
            echo "database=$database"
          } >> "$GITHUB_OUTPUT"

      # `react-compiler` cuenta warnings como errores: fail-fast real.
      - name: ESLint (max-warnings 0)
        if: steps.areas.outputs.frontend == 'true'
        run: bun run lint -- --max-warnings 0

      - name: TypeScript typecheck
        if: steps.areas.outputs.frontend == 'true'
        run: bun run typecheck

      # Suite completa: sin coverage, sin shards, sin retries.
      - name: Vitest (suite completa, incluye guardrails de arquitectura)
        if: steps.areas.outputs.frontend == 'true'
        run: bun run test

      # Guard estático de BD: sólo cuando el diff toca migraciones/schema/tests/
      # releases, los scripts de auditoría, appVersion, dependencias o este CI.
      # Bloqueante; sin audit:all, sin reports, sin duplicar audits de frontend
      # (ésos ya corren dentro de Vitest).
      - name: Auditorías estáticas de BD (bloqueantes)
        if: steps.areas.outputs.database == 'true'
        run: |
          bun run audit:manifest
          bun run audit:schema
          bun run audit:schema-functions
          bun run audit:migrations
          bun run audit:replay-mirror
          bun run audit:rpc-sync

      - name: Build (sin ANALYZE)
        if: steps.areas.outputs.frontend == 'true'
        env:
          ANALYZE: "false"
        run: bun run build


      # Edge Functions: sólo si cambia supabase/functions o este workflow.
      - name: Setup Deno
        if: steps.areas.outputs.edge == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Paridad con el runtime real de las Edge Functions (Deno 2).
          deno-version: v2.6.x

      - name: Deno tests (con typecheck, excluye smoke)
        if: steps.areas.outputs.edge == 'true'
        # SIN `--no-check`: `deno test` valida también los tipos de las edges.
        run: |
          set -uo pipefail
          readarray -t tests < <(find supabase/functions -name '*_test.ts' ! -name 'smoke_test.ts')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No se encontró ningún test Deno (patrón *_test.ts)."
            exit 1
          fi
          deno test \
            --node-modules-dir=none \
            --allow-env \
            --allow-net \
            --allow-read \
            "${tests[@]}"
