name: CI

on:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  quality:
    name: Lint, typecheck, unused code & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: ESLint (max-warnings 0)
        run: bun run lint -- --max-warnings 0

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Unused code check (knip)
        run: bun run lint:unused

      - name: Strict unused exports & types
        if: always()
        run: bun run lint:unused:strict

      - name: Test hygiene (no skip/only/todo, no duplicate titles)
        run: bun run audit:tests

      - name: Architecture audit
        run: bun run audit:arch

      - name: Casts audit
        run: bun run audit:casts

      - name: Architecture gating tests (oversized, casts, layers, shadow folders)
        run: bunx vitest run src/lib/__tests__/architecture.test.ts src/lib/__tests__/architecture-baseline.test.ts src/__tests__/audit-report.test.ts src/__tests__/audit-casts-classifier.test.ts

      - name: Architecture & cast report
        if: always()
        run: bun run audit:report

      - name: PR summary (audit report)
        if: always() && github.event_name == 'pull_request'
        run: cat reports/audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report
          path: |
            reports/audit-report.md
            reports/audit-report.json
          retention-days: 30

      - name: Cache Vite build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lockb', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Build (with bundle analyzer)
        env:
          ANALYZE: "true"
        run: bun run build

      - name: Bundle size gate (entry chunk gzipped)
        env:
          BUNDLE_BUDGET_KB: "350"
        run: bash scripts/check-bundle-size.sh

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: dist/bundle-stats.html
          if-no-files-found: ignore
          retention-days: 14


  edge-functions:
    name: Edge Functions (Deno tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v1.x

      - name: Cache Deno deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/*.ts', 'supabase/functions/**/deno.json', 'supabase/functions/**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Run Deno tests (excluding smoke)
        # --no-check: el ecosistema Deno+esm.sh emite muchos errores TS2578
        # ("Unused @ts-expect-error") cuando los tipos de `Deno.*` y de los
        # @supabase/* remotos se resuelven completamente. Mantenemos los
        # @ts-expect-error porque en el bundle web (vitest/tsc) sí son
        # necesarios. El typecheck de Deno se hace en `deno test` localmente.
        run: |
          readarray -t tests < <(find supabase/functions -name '*_test.ts' ! -name 'smoke_test.ts')
          deno test \
            --allow-env \
            --allow-net \
            --allow-read \
            --no-check \
            "${tests[@]}"

  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Cache Vitest reports
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules/.vitest
            .vitest-reports
          key: ${{ runner.os }}-vitest-${{ matrix.shard }}-${{ hashFiles('bun.lockb', 'vitest.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vitest-${{ matrix.shard }}-

      - name: Prepare blob output directory
        run: mkdir -p .vitest-reports

      - name: Tests + coverage (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: bun run test:coverage:shard -- --shard=${{ matrix.shard }}/${{ matrix.total }} --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: List blob outputs (debug)
        if: always()
        run: ls -la .vitest-reports/ || echo "empty"

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload JUnit report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.shard }}
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage merge & report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun + install
        uses: ./.github/actions/setup-bun

      - name: Download shard blobs
        id: download-blobs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: .vitest-reports/
          merge-multiple: true

      - name: Check blob reports
        id: check-blobs
        run: |
          if [ ! "$(ls -A .vitest-reports/ 2>/dev/null)" ]; then
            echo "::warning::No blob reports encontrados. Merge de coverage omitido."
            echo "skip_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge reports + coverage thresholds
        if: steps.check-blobs.outputs.skip_merge != 'true'
        run: bun run test:coverage:merge

      - name: Coverage report (markdown)
        if: always()
        run: bun run coverage:report || true

      - name: PR summary (coverage)
        if: always() && github.event_name == 'pull_request'
        run: |
          if test -f reports/coverage-report.md; then
            cat reports/coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/
            reports/coverage-report.md
          retention-days: 30

      # Codecov upload (informational — no falla el job si el token no está).
      # Para activar reporting nominal: agregar `CODECOV_TOKEN` como secret de repo.
      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-success:
    name: CI Success (aggregator)
    needs: [quality, edge-functions, tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Verify all required jobs succeeded
        run: |
          # Falla si cualquier job requerido falló o fue cancelado.
          # Úsalo como único required check en branch protection: así puedes
          # cambiar la matriz de shards sin tocar la configuración del repo.
          if [ "${{ needs.quality.result }}" != "success" ] \
            || [ "${{ needs.edge-functions.result }}" != "success" ] \
            || [ "${{ needs.tests.result }}" != "success" ] \
            || [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::Uno o más jobs requeridos no terminaron en success."
            echo "quality=${{ needs.quality.result }}"
            echo "edge-functions=${{ needs.edge-functions.result }}"
            echo "tests=${{ needs.tests.result }}"
            echo "coverage=${{ needs.coverage.result }}"
            exit 1
          fi
          echo "Todos los jobs requeridos pasaron."
