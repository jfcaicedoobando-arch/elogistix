name: post-deploy-smoke

# Smoke manual que verifica que los endpoints críticos del backend desplegado
# respondan con el contrato esperado. Cubre lo mismo que antes:
#   - user-management (smoke_test.ts con login real)
#   - exchange-rates (HTTP smoke vía curl)
#   - tracking-public (HTTP smoke vía curl)
#   - RPC smoke de dinero como `authenticated`
#
# CI simplificado (YAGNI): SÓLO workflow_dispatch, UN job y sin automatización
# de issues. Todo en un job porque GitHub enmascara los secrets al pasarlos como
# outputs entre jobs y el ANON_KEY llegaba corrupto, rompiendo el login.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke post-deploy (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Paridad con el runtime real de las Edge Functions (Deno 2).
          deno-version: v2.6.x

      # Los dos valores son PUBLICABLES (url + anon). Se resuelven DENTRO del
      # job (nunca se imprimen ni se transportan entre jobs) y si faltan se
      # falla con un mensaje claro en vez de un críptico exit 3 de curl.
      - name: Resolver SUPABASE_URL y ANON_KEY (sin imprimirlos)
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SECRET_URL:-}"
          KEY="${SECRET_KEY:-}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_ANON_KEY ausentes; usando los valores publicables de .env"
            if [ -f .env ]; then
              [ -n "$URL" ] || URL=$(grep -E '^VITE_SUPABASE_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
              [ -n "$KEY" ] || KEY=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
            fi
          fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No hay SUPABASE_URL/ANON_KEY disponibles (ni secrets ni .env). Configura los secrets del repositorio."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Fetch demo credentials
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/functions/v1/demo-access" > /tmp/demo.json
          EMAIL=$(jq -r '.email' /tmp/demo.json)
          PASSWORD=$(jq -r '.password' /tmp/demo.json)
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ]; then
            echo "::error::demo-access no devolvió credenciales válidas"
            exit 1
          fi
          # Enmascarar también el email: evita que aparezca en logs de Actions.
          echo "::add-mask::$EMAIL"
          echo "DEMO_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "DEMO_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Run user-management smoke
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
        run: |
          deno test \
            --node-modules-dir=none \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/user-management/smoke_test.ts

      - name: Ping exchange-rates
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/exchange-rates")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          test "$STATUS" = "200"
          # Contrato mínimo: payload con claves usdMxn/eurMxn (o rates/USD/MXN como fallback)
          grep -E '"(usdMxn|eurMxn|rates|USD|MXN)"' /tmp/resp.json > /dev/null

      - name: Ping tracking-public (token inexistente debe responder 404/410)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/tracking-public?token=smoke-no-existe-xyz")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          # Esperamos 404 (no encontrado) o 410 (expirado). 200/500 = degradación.
          if [ "$STATUS" != "404" ] && [ "$STATUS" != "410" ] && [ "$STATUS" != "400" ]; then
            echo "::error::tracking-public respondió $STATUS (esperado 404/410/400)"
            exit 1
          fi

      - name: Login demo (token para los RPC smoke)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$DEMO_USER_EMAIL\",\"password\":\"$DEMO_USER_PASSWORD\"}" \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::login demo fallo - no se obtuvo access_token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "DEMO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: RPC duplicar_cotizacion - jamas 42703/42883 (B-016)
        run: |
          set -euo pipefail
          BODY=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"00000000-0000-0000-0000-000000000000"}' \
            "${SUPABASE_URL}/rest/v1/rpc/duplicar_cotizacion")
          STATUS=$(tail -n1 <<<"$BODY")
          PAYLOAD=$(head -n-1 <<<"$BODY")
          echo "HTTP $STATUS - $PAYLOAD"
          # La funcion ROTA se detecta por SQLSTATE de esquema/firma (42703/42883),
          # no por el HTTP status: un bloqueo de negocio con RAISE (P0001/P0002,
          # p.ej. "Cotizacion no encontrada") es la respuesta ESPERADA para un UUID
          # inexistente y PostgREST lo devuelve como 500/404 segun el codigo.
          if grep -qE '"code":"(42703|42883)"' <<<"$PAYLOAD"; then
            echo "::error::duplicar_cotizacion ROTA en el entorno desplegado (42703/42883) - patron B-016"
            exit 1
          fi
          # Un 500 SIN codigo de negocio (P0001/P0002) si es un fallo real.
          if [ "$STATUS" = "500" ] && ! grep -qE '"code":"(P0001|P0002)"' <<<"$PAYLOAD"; then
            echo "::error::duplicar_cotizacion devolvio 500 sin bloqueo de negocio - patron B-016"
            exit 1
          fi

      - name: RPC cxc_aging_clientes - jamas 42703/42883/500
        run: |
          set -euo pipefail
          BODY=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/cxc_aging_clientes")
          STATUS=$(tail -n1 <<<"$BODY")
          PAYLOAD=$(head -n-1 <<<"$BODY")
          echo "HTTP $STATUS - $PAYLOAD"
          if [ "$STATUS" = "500" ] || grep -qE '"code":"(42703|42883)"' <<<"$PAYLOAD"; then
            echo "::error::cxc_aging_clientes ROTA en el entorno desplegado (42703/42883/500)"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::cxc_aging_clientes respondio HTTP $STATUS (esperado 200)"
            exit 1
          fi
          jq -e 'type == "array"' <<<"$PAYLOAD" > /dev/null

      - name: Soft delete como authenticated - jamas 401/403/500 (B-001)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/patch.json -w "%{http_code}" -X PATCH \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"deleted_at":"2026-01-01T00:00:00Z"}' \
            "${SUPABASE_URL}/rest/v1/cotizaciones?id=eq.00000000-0000-0000-0000-000000000000")
          echo "HTTP $STATUS"
          cat /tmp/patch.json || true
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "500" ]; then
            echo "::error::soft delete como authenticated bloqueado (HTTP $STATUS) - patron B-001"
            exit 1
          fi
          test "$STATUS" = "204"
