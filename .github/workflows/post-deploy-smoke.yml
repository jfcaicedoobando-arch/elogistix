name: post-deploy-smoke

# Smoke test diario que verifica que los edge functions críticos en producción
# (https://elogistix.lovable.app + https://librecarga.com) respondan con el
# contrato esperado. Cubre:
#   - user-management (smoke_test.ts con login real)
#   - exchange-rates (HTTP smoke vía curl)
#   - tracking-public (HTTP smoke vía curl)

on:
  schedule:
    # 13:00 UTC = 07:00 CDMX (UTC-6)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

env:
  SUPABASE_URL: https://eorqadkulqtneqjbsblk.supabase.co
  # anon key — pública (rol anon), no es un secreto
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvcnFhZGt1bHF0bmVxamJzYmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMzM5MzEsImV4cCI6MjA4NzgwOTkzMX0.bNeS84nv01bheza5wL5l8N-2A2OONn0fKKkZQ8ADZRc

jobs:
  user-management-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v1.46.x

      - name: Fetch demo credentials
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/functions/v1/demo-access" > /tmp/demo.json
          EMAIL=$(jq -r '.email' /tmp/demo.json)
          PASSWORD=$(jq -r '.password' /tmp/demo.json)
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ]; then
            echo "::error::demo-access no devolvió credenciales válidas"
            cat /tmp/demo.json
            exit 1
          fi
          # 13.162.0 — Enmascarar también el email. Aunque es una cuenta demo,
          # evita que aparezca en logs públicos de Actions.
          echo "::add-mask::$EMAIL"
          echo "DEMO_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "DEMO_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Run user-management smoke
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/user-management/smoke_test.ts


  exchange-rates-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping exchange-rates
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/exchange-rates")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          test "$STATUS" = "200"
          # Contrato mínimo: payload con claves usdMxn/eurMxn (o rates/USD/MXN como fallback)
          grep -E '"(usdMxn|eurMxn|rates|USD|MXN)"' /tmp/resp.json > /dev/null

  tracking-public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping tracking-public (token inexistente debe responder 404/410)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/tracking-public?token=smoke-no-existe-xyz")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          # Esperamos 404 (no encontrado) o 410 (expirado). 200/500 = degradación.
          if [ "$STATUS" != "404" ] && [ "$STATUS" != "410" ] && [ "$STATUS" != "400" ]; then
            echo "::error::tracking-public respondió $STATUS (esperado 404/410/400)"
            exit 1
          fi

  notify-failure:
    name: Notificar fallo de smoke (issue)
    needs: [user-management-smoke, exchange-rates-smoke, tracking-public-smoke]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Crear o actualizar issue de fallo
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = 'smoke-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 post-deploy-smoke falló (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `El workflow **post-deploy-smoke** falló.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- SHA: \`${context.sha}\``,
              ``,
              `Revisar logs de los jobs: user-management-smoke / exchange-rates-smoke / tracking-public-smoke.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

