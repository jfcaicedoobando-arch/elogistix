name: post-deploy-smoke

# Smoke test semanal que verifica que los edge functions críticos en producción
# (https://elogistix.lovable.app + https://librecarga.com) respondan con el
# contrato esperado. Cubre:
#   - user-management (smoke_test.ts con login real)
#   - exchange-rates (HTTP smoke vía curl)
#   - tracking-public (HTTP smoke vía curl)
#
# CI simplificado: sólo schedule semanal (lunes) + dispatch manual.

on:
  schedule:
    # Lunes 13:00 UTC = 07:00 CDMX (UTC-6)
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  # v13.480.3 — Los 4 jobs fallaban con exit code 3 (curl: "URL malformada")
  # porque los secrets SUPABASE_URL / SUPABASE_ANON_KEY no están configurados en
  # el repo. Ambos valores son PUBLICABLES (anon), así que este job los resuelve
  # desde los secrets y, si faltan, cae al `.env` versionado. Si tampoco existen,
  # falla con un mensaje claro en vez de un críptico exit 3.
  config:
    name: Resolver credenciales públicas
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      supabase_url: ${{ steps.resolve.outputs.supabase_url }}
      anon_key: ${{ steps.resolve.outputs.anon_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolver SUPABASE_URL y ANON_KEY
        id: resolve
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SECRET_URL:-}"
          KEY="${SECRET_KEY:-}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_ANON_KEY ausentes; usando los valores publicables de .env"
            if [ -f .env ]; then
              [ -n "$URL" ] || URL=$(grep -E '^VITE_SUPABASE_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
              [ -n "$KEY" ] || KEY=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
            fi
          fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No hay SUPABASE_URL/ANON_KEY disponibles (ni secrets ni .env). Configura los secrets del repositorio."
            exit 1
          fi
          echo "supabase_url=$URL" >> "$GITHUB_OUTPUT"
          echo "anon_key=$KEY" >> "$GITHUB_OUTPUT"

  user-management-smoke:
    runs-on: ubuntu-24.04
    needs: config
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ needs.config.outputs.supabase_url }}
      ANON_KEY: ${{ needs.config.outputs.anon_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false


      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v1.46.x


      - name: Fetch demo credentials
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/functions/v1/demo-access" > /tmp/demo.json
          EMAIL=$(jq -r '.email' /tmp/demo.json)
          PASSWORD=$(jq -r '.password' /tmp/demo.json)
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ]; then
            echo "::error::demo-access no devolvió credenciales válidas"
            cat /tmp/demo.json
            exit 1
          fi
          # 13.162.0 — Enmascarar también el email. Aunque es una cuenta demo,
          # evita que aparezca en logs públicos de Actions.
          echo "::add-mask::$EMAIL"
          echo "DEMO_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "::add-mask::$PASSWORD"
          echo "DEMO_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Run user-management smoke
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
        run: |
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            supabase/functions/user-management/smoke_test.ts


  exchange-rates-smoke:
    runs-on: ubuntu-24.04
    needs: config
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ needs.config.outputs.supabase_url }}
      ANON_KEY: ${{ needs.config.outputs.anon_key }}
    steps:
      - name: Ping exchange-rates
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/exchange-rates")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          test "$STATUS" = "200"
          # Contrato mínimo: payload con claves usdMxn/eurMxn (o rates/USD/MXN como fallback)
          grep -E '"(usdMxn|eurMxn|rates|USD|MXN)"' /tmp/resp.json > /dev/null

  tracking-public-smoke:
    runs-on: ubuntu-24.04
    needs: config
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ needs.config.outputs.supabase_url }}
      ANON_KEY: ${{ needs.config.outputs.anon_key }}
    steps:

      - name: Ping tracking-public (token inexistente debe responder 404/410)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/tracking-public?token=smoke-no-existe-xyz")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          # Esperamos 404 (no encontrado) o 410 (expirado). 200/500 = degradación.
          if [ "$STATUS" != "404" ] && [ "$STATUS" != "410" ] && [ "$STATUS" != "400" ]; then
            echo "::error::tracking-public respondió $STATUS (esperado 404/410/400)"
            exit 1
          fi

  rpc-smoke:
    name: RPC smoke (dinero, como authenticated)
    runs-on: ubuntu-24.04
    needs: config
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ needs.config.outputs.supabase_url }}
      ANON_KEY: ${{ needs.config.outputs.anon_key }}
    steps:

      - name: Login demo (reutiliza demo-access)
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/functions/v1/demo-access" > /tmp/demo.json
          EMAIL=$(jq -r '.email' /tmp/demo.json)
          PASSWORD=$(jq -r '.password' /tmp/demo.json)
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [ -z "$PASSWORD" ] || [ "$PASSWORD" = "null" ]; then
            echo "::error::demo-access no devolvio credenciales validas"
            cat /tmp/demo.json
            exit 1
          fi
          TOKEN=$(curl -sS -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::login demo fallo - no se obtuvo access_token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "DEMO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: RPC duplicar_cotizacion - jamas 42703/42883 (B-016)
        run: |
          set -euo pipefail
          BODY=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"00000000-0000-0000-0000-000000000000"}' \
            "${SUPABASE_URL}/rest/v1/rpc/duplicar_cotizacion")
          STATUS=$(tail -n1 <<<"$BODY")
          PAYLOAD=$(head -n-1 <<<"$BODY")
          echo "HTTP $STATUS - $PAYLOAD"
          # La funcion ROTA se detecta por SQLSTATE de esquema/firma (42703/42883),
          # no por el HTTP status: un bloqueo de negocio con RAISE (P0001/P0002,
          # p.ej. "Cotizacion no encontrada") es la respuesta ESPERADA para un UUID
          # inexistente y PostgREST lo devuelve como 500/404 segun el codigo.
          if grep -qE '"code":"(42703|42883)"' <<<"$PAYLOAD"; then
            echo "::error::duplicar_cotizacion ROTA en el entorno desplegado (42703/42883) - patron B-016"
            exit 1
          fi
          # Un 500 SIN codigo de negocio (P0001/P0002) si es un fallo real.
          if [ "$STATUS" = "500" ] && ! grep -qE '"code":"(P0001|P0002)"' <<<"$PAYLOAD"; then
            echo "::error::duplicar_cotizacion devolvio 500 sin bloqueo de negocio - patron B-016"
            exit 1
          fi

      - name: RPC cxc_aging_clientes - jamas 42703/42883/500
        run: |
          set -euo pipefail
          BODY=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/cxc_aging_clientes")
          STATUS=$(tail -n1 <<<"$BODY")
          PAYLOAD=$(head -n-1 <<<"$BODY")
          echo "HTTP $STATUS - $PAYLOAD"
          if [ "$STATUS" = "500" ] || grep -qE '"code":"(42703|42883)"' <<<"$PAYLOAD"; then
            echo "::error::cxc_aging_clientes ROTA en el entorno desplegado (42703/42883/500)"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "::error::cxc_aging_clientes respondio HTTP $STATUS (esperado 200)"
            exit 1
          fi
          jq -e 'type == "array"' <<<"$PAYLOAD" > /dev/null

      - name: Soft delete como authenticated - jamas 401/403/500 (B-001)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/patch.json -w "%{http_code}" -X PATCH \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${DEMO_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"deleted_at":"2026-01-01T00:00:00Z"}' \
            "${SUPABASE_URL}/rest/v1/cotizaciones?id=eq.00000000-0000-0000-0000-000000000000")
          echo "HTTP $STATUS"
          cat /tmp/patch.json || true
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "500" ]; then
            echo "::error::soft delete como authenticated bloqueado (HTTP $STATUS) - patron B-001"
            exit 1
          fi
          test "$STATUS" = "204"

  notify-failure:
    name: Notificar fallo de smoke (issue)
    needs: [config, user-management-smoke, exchange-rates-smoke, tracking-public-smoke, rpc-smoke]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Crear o actualizar issue de fallo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'smoke-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 post-deploy-smoke falló (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `El workflow **post-deploy-smoke** falló.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- SHA: \`${context.sha}\``,
              ``,
              `Revisar logs de los jobs: user-management-smoke / exchange-rates-smoke / tracking-public-smoke / rpc-smoke.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

