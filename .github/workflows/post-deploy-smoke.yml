name: post-deploy-smoke

# Smoke manual que verifica que los endpoints críticos del backend desplegado
# respondan con el contrato esperado con el acceso demo deshabilitado:
#   - demo-access: HTTP 503 y objeto exacto {"error":"demo_unavailable"}
#   - exchange-rates y tracking-public (HTTP smoke vía curl)
#   - user-management, RPC y soft delete autenticados: omitidos explícitamente
#
# CI simplificado (YAGNI): SÓLO workflow_dispatch, UN job y sin automatización
# de issues. Todo en un job porque GitHub enmascara los secrets al pasarlos como
# outputs entre jobs y el ANON_KEY llegaba corrupto, rompiendo el login.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke post-deploy (manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # CLI estable fijado; no selecciona el runtime remoto de Supabase.
          deno-version: v2.9.7

      - name: Run demo-disabled smoke contract regressions (local only)
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno test \
            --sanitize-ops \
            --sanitize-resources \
            --node-modules-dir=none \
            --allow-read \
            scripts/ci/post-deploy-smoke.test.mjs

      # Los dos valores son PUBLICABLES (url + anon). Se resuelven DENTRO del
      # job (nunca se imprimen ni se transportan entre jobs) y si faltan se
      # falla con un mensaje claro en vez de un críptico exit 3 de curl.
      - name: Resolver SUPABASE_URL y ANON_KEY (sin imprimirlos)
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          URL="${SECRET_URL:-}"
          KEY="${SECRET_KEY:-}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_ANON_KEY ausentes; usando los valores publicables de .env"
            if [ -f .env ]; then
              [ -n "$URL" ] || URL=$(grep -E '^VITE_SUPABASE_URL=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
              [ -n "$KEY" ] || KEY=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"'[:space:]')
            fi
          fi
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No hay SUPABASE_URL/ANON_KEY disponibles (ni secrets ni .env). Configura los secrets del repositorio."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Verify demo-access is disabled
        run: |
          set -euo pipefail
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          STATUS=$(curl --connect-timeout 15 --max-time 45 -sS \
            -o "$RESPONSE_FILE" -w "%{http_code}" -X POST \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL}/functions/v1/demo-access")
          # No usar curl --fail: 503 es el cierre esperado. No imprimir el body.
          node --input-type=commonjs - "$STATUS" "$RESPONSE_FILE" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [status, responseFile] = process.argv.slice(2);
          const fail = () => {
            console.error('::error::demo-access debe responder HTTP 503 con el objeto exacto {"error":"demo_unavailable"}');
            process.exit(1);
          };
          let payload;
          let responseText;
          try {
            responseText = readFileSync(responseFile, "utf8");
            payload = JSON.parse(responseText);
          } catch {
            fail();
          }
          // Check the raw single-member contract too: JSON.parse alone discards
          // duplicate keys and decodes escaped keys that can conceal extra values.
          // Only JSON whitespace is allowed; no body content is logged.
          const exactBody = /^[ \t\r\n]*\{[ \t\r\n]*"error"[ \t\r\n]*:[ \t\r\n]*"demo_unavailable"[ \t\r\n]*\}[ \t\r\n]*$/;
          if (status !== "503" || !exactBody.test(responseText) || !payload || typeof payload !== "object" ||
              Array.isArray(payload) || Object.keys(payload).length !== 1 ||
              payload.error !== "demo_unavailable") {
            fail();
          }
          console.log("demo-access cerrado: HTTP 503 demo_unavailable sin credenciales");
          NODE

      - name: Ping exchange-rates
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.ANON_KEY != '' }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/exchange-rates")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          test "$STATUS" = "200"
          # Contrato mínimo: payload con claves usdMxn/eurMxn (o rates/USD/MXN como fallback)
          grep -E '"(usdMxn|eurMxn|rates|USD|MXN)"' /tmp/resp.json > /dev/null

      - name: Ping tracking-public (token inexistente debe responder 404/410)
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.ANON_KEY != '' }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/tracking-public?token=smoke-no-existe-xyz")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          # Esperamos 404 (no encontrado) o 410 (expirado). 200/500 = degradación.
          if [ "$STATUS" != "404" ] && [ "$STATUS" != "410" ] && [ "$STATUS" != "400" ]; then
            echo "::error::tracking-public respondió $STATUS (esperado 404/410/400)"
            exit 1
          fi

      - name: Report credential-dependent checks as omitted
        if: ${{ !cancelled() }}
        run: |
          echo "::notice::OMITIDOS user-management, duplicar_cotizacion, cxc_aging_clientes y soft delete authenticated: acceso demo deshabilitado, sin credenciales."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Cobertura con acceso demo deshabilitado

          Las siguientes comprobaciones se omiten porque requieren credenciales demo:
          - user-management/smoke_test.ts (login real).
          - RPC duplicar_cotizacion como authenticated (B-016).
          - RPC cxc_aging_clientes como authenticated.
          - Soft delete de cotizaciones como authenticated (B-001).

          Esta ejecución no valida esas operaciones autenticadas.
          SUMMARY
