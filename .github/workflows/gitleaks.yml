name: gitleaks

# Escaneo de secretos en cada PR. Permite el ANON_KEY público del proyecto
# (rol anon de Supabase) vía `.gitleaks.toml`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # El action omite merges en su rango histórico. El binario instalado por
      # el mismo action escanea además los blobs finales del diff, sin credenciales.
      - name: Verify snapshot scan contracts
        env:
          REQUIRE_GITLEAKS_BINARY: '1'
        run: |
          export GITLEAKS_TEST_BINARY="$(command -v gitleaks)"
          python3 -m unittest discover -s scripts/ci -p test_gitleaks_snapshot.py -v

      - name: Scan final changed content
        run: python3 scripts/ci/gitleaks_snapshot.py
