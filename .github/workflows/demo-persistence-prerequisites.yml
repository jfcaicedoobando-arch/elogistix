name: Demo persistence offline prerequisites (SQL NOT_RUN)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'scripts/ci/demo-persistence-review/**'
      - 'docs/qa/demo-persistence/**'
      - '.github/workflows/demo-persistence-prerequisites.yml'
permissions:
  contents: read
jobs:
  offline-intake-only:
    if: github.repository == 'jfcaicedoobando-arch/elogistix' && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/persistence-pg176-quarantine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Synthetic archive integrity and rejection tests (no database)
        run: python3 -B -m unittest discover -s scripts/ci/demo-persistence-review -p 'test_*.py' -v
      - name: Explicit scope
        run: echo 'Offline prerequisites only. PostgreSQL lane NOT_RUN. Wire UNBOUND. No demo activation.'
