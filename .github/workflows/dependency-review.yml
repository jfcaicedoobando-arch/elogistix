name: Dependency Review

# Revisa dependencias agregadas/modificadas en PRs.
# Falla si hay vulnerabilidades de severidad >= high.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        # 13.162.0 — Endurecido de `high` a `moderate`. Multi-tenant + fiscal +
        # payments justifica bajar el umbral. Si aparecen falsos positivos,
        # agregar el CVE/ID a `allow-ghsas` con justificación en el comentario.
        uses: actions/dependency-review-action@67d4f4bd7a9b17a0db54d2a7519187c65e339de8 # v4.5.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # allow-ghsas: |
          #   GHSA-xxxx-xxxx-xxxx  # motivo de la excepción
