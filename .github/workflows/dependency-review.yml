name: Dependency Review

# Revisa dependencias agregadas/modificadas en PRs.
# Falla si hay vulnerabilidades de severidad >= high.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # v13.322.1 (GHA-audit H4) — no se hace push/fetch autenticado.
          persist-credentials: false

      - name: Dependency Review
        # 13.162.0 — Endurecido de `high` a `moderate`. Multi-tenant + fiscal +
        # payments justifica bajar el umbral. Si aparecen falsos positivos,
        # agregar el CVE/ID a `allow-ghsas` con justificación en el comentario.
        uses: actions/dependency-review-action@67d4f4bd7a9b17a0db54d2a7519187c65e339de8 # v4.5.0
        with:
          fail-on-severity: moderate
          # v13.322.1 (GHA-audit H5) — Sólo dependencias de runtime bloquean;
          # las devDependencies no llegan al bundle de producción.
          fail-on-scopes: runtime
          # Licencias copyleft fuertes / no comerciales: incompatibles con un
          # ERP propietario. Si una dep legítima aparece aquí, añadirla a
          # `allow-dependencies-licenses` con justificación.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
          # allow-ghsas: |
          #   GHSA-xxxx-xxxx-xxxx  # motivo de la excepción
