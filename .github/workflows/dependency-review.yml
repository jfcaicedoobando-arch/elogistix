name: Dependency Review

# Revisa dependencias agregadas/modificadas en PRs.
# Falla si hay vulnerabilidades de severidad >= high.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Dependency Review
        # 13.162.0 — Endurecido de `high` a `moderate`. Multi-tenant + fiscal +
        # payments justifica bajar el umbral. Si aparecen falsos positivos,
        # agregar el CVE/ID a `allow-ghsas` con justificación en el comentario.
        uses: actions/dependency-review-action@da6b129d277471d01428781accece1bd831a8b0d # v4.5.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # allow-ghsas: |
          #   GHSA-xxxx-xxxx-xxxx  # motivo de la excepción
