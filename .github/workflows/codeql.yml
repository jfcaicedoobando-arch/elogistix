name: CodeQL

# Análisis estático de seguridad con CodeQL para JS/TS.
# Corre en push/PR a main y semanalmente los lunes 06:00 UTC.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      # 13.320.20 — Workaround para bug de CodeQL Action donde el fetch shallow
      # de `main` falla ("fatal: error processing shallow info: 4") y genera un
      # pr-diff-range.yml con filas "undefined" que aborta el análisis.
      # Desactivar diff-informed queries fuerza el escaneo completo del PR.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # 13.162.0 — Excluir tests, e2e y SQL helpers de RLS para reducir
          # findings ruidosos que no aplican a código de producción.
          config: |
            paths-ignore:
              - '**/__tests__/**'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - 'e2e/**'
              - 'supabase/tests/**'
              - 'scripts/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
