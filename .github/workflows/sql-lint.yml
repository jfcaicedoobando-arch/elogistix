name: SQL Lint (migrations)

# Lint de migraciones SQL en PR usando sqlfluff (dialecto postgres).
# Solo se ejecuta cuando el PR toca supabase/migrations/**.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".sqlfluff"
      - ".github/workflows/sql-lint.yml"

permissions:
  contents: read

concurrency:
  group: sql-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    name: sqlfluff (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install sqlfluff
        run: pip install "sqlfluff==3.2.5"

      - name: Lint migrations
        run: sqlfluff lint supabase/migrations --dialect postgres
