name: CRM committed state observation synthetic review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/crm-operational-event-envelope-20261015]
    paths:
      - 'scripts/ci/crm-operational-events-review/**'
      - '.github/workflows/crm-committed-state-review.yml'
permissions:
  contents: read
concurrency:
  group: crm-committed-state-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  changed-base-requires-review:
    if: >-
      github.repository == 'jfcaicedoobando-arch/elogistix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/crm-committed-state-observation' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.sha != 'a4778ec3933e2c6d04839d448fb894d76b19a6a7'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject changed recorded parent before checkout or Docker
        run: exit 1
  synthetic-review:
    if: >-
      github.repository == 'jfcaicedoobando-arch/elogistix' &&
      github.event.repository.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.owner.login == 'jfcaicedoobando-arch' &&
      github.event.pull_request.head.repo.owner.login == 'jfcaicedoobando-arch' &&
      github.event.pull_request.base.ref == 'codex/crm-operational-event-envelope-20261015' &&
      github.event.pull_request.base.sha == 'a4778ec3933e2c6d04839d448fb894d76b19a6a7' &&
      github.event.pull_request.head.ref == 'codex/crm-committed-state-observation' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact event head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact inherited bytes and offline contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crm-committed-preflight"
          python3 -B scripts/ci/crm-operational-events-review/committed_gate.py 2>&1 | tee "$RUNNER_TEMP/crm-committed-preflight/gate.log"
          python3 -B -m unittest discover -s scripts/ci/crm-operational-events-review -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/crm-committed-preflight/offline-tests.log"
      - name: Owned network-disabled PostgreSQL 17.6 committed observation cases
        run: |
          set -euo pipefail
          python3 -B scripts/ci/crm-operational-events-review/run_committed_ci.py --output "$RUNNER_TEMP/crm-committed-evidence" 2>&1 | tee "$RUNNER_TEMP/crm-committed-preflight/runtime.log"
      - name: Independently validate all complete synthetic projections
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP/crm-committed-evidence/committed-evidence"
          $bundles = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'bundle.json')
          $projections = @(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'projection-*.json')
          if ($bundles.Count -ne 23 -or $projections.Count -ne 184) { throw 'Incomplete owned observation matrix' }
          foreach ($file in $projections) {
            if (-not (Test-Json -Json (Get-Content -LiteralPath $file.FullName -Raw) -SchemaFile 'scripts/ci/crm-canonical-review/operational-capture/evidence.schema.json' -ErrorAction Stop)) {
              throw 'Invalid projection'
            }
          }
          $summaries = @(Get-ChildItem -LiteralPath $root -File -Filter '*-summary.json')
          if ($summaries.Count -ne 4) { throw 'Four positive observation summaries required' }
          foreach ($file in $summaries) {
            $summary = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
            if ($summary.admission -ne 'NOT_ADMITTED' -or
                $summary.comparison -ne 'MATCHED_COMMITTED_STATE_OBSERVATION_REVIEW_ONLY' -or
                $summary.retry_permission -ne 'NOT_GRANTED') { throw 'Unsafe summary' }
          }
          'PASS 184 complete projections; 23 bundles; four NOT_ADMITTED committed observations' |
            Tee-Object -FilePath "$env:RUNNER_TEMP/crm-committed-preflight/projection-schema.log"
      - name: Preserve synthetic evidence and cleanup status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crm-committed-state-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/crm-committed-preflight
            ${{ runner.temp }}/crm-committed-evidence
          if-no-files-found: warn
          retention-days: 14
