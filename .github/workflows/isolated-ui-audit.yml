name: Isolated UI audit (119/126)

# Synthetic component fixture only. Never invoke staging E2E, app bootstrap,
# provisioning, credentials, deploys, or financial/backend writes from this job.
on:
  pull_request:
    # Incluye todo src: no perder imports transitivos de las fixtures.
    paths:
      - 'src/**'
      - 'e2e/visual/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '*tailwind*'
      - '*postcss*'
      - '*vite*'
      - '.github/actions/setup-bun/**'
      - '.github/workflows/isolated-ui-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cxp-filter-focus:
    name: Isolated CxP filter focus (12 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install lockfile Chromium and system dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Typecheck and lint isolated CxP fixture
        run: |
          node node_modules/typescript/bin/tsc -p e2e/visual/cxp-filters/tsconfig.json
          node node_modules/eslint/bin/eslint.js --no-cache e2e/visual/cxp-filters
      - name: Build fresh isolated fixture and run 12 focus and draft cases
        run: node node_modules/@playwright/test/cli.js test --config e2e/visual/cxp-filters/playwright.config.ts
      - name: Require all 12 cases without skips or retries
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { stats } = JSON.parse(readFileSync("reports/cxp-filters/results.json", "utf8"));
          if (stats.expected !== 12 || stats.unexpected !== 0 || stats.skipped !== 0 || stats.flaky !== 0) {
            throw new Error(`Expected 12 passing CxP GUI cases with no skips/retries: ${JSON.stringify(stats)}`);
          }
          JS
      - name: Upload synthetic CxP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-cxp-filters
          path: |
            test-results/cxp-filters/
            reports/cxp-filters/
          retention-days: 3
          if-no-files-found: warn

  dialog-card:
    name: Isolated dialog and payment cards (20 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install lockfile Playwright Chromium and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/audit119-126
          node node_modules/@playwright/test/cli.js install --with-deps chromium 2>&1 | tee reports/audit119-126/browser-install.log
      - name: Typecheck isolated fixture and tests
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p e2e/visual/audit119-126/tsconfig.json 2>&1 | tee reports/audit119-126/typecheck.log
      - name: Build isolated fixture (empty envDir, no app/backend)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/audit119-126
          node node_modules/vite/bin/vite.js build --config e2e/visual/audit119-126/vite.config.ts 2>&1 | tee reports/audit119-126/build.log
      - name: Check 20 browser cases
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config e2e/visual/audit119-126/playwright.config.ts 2>&1 | tee reports/audit119-126/browser.log
      - name: Require all 20 cases without skips
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { stats } = JSON.parse(readFileSync("reports/audit119-126/results.json", "utf8"));
          if (stats.expected !== 20 || stats.unexpected !== 0 || stats.skipped !== 0 || stats.flaky !== 0) {
            throw new Error(`Expected 20 passing GUI cases with no skips/retries: ${JSON.stringify(stats)}`);
          }
          JS
      - name: Upload compact synthetic screenshots and facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-audit-119-126-images-and-facts
          path: |
            test-results/audit119-126/**/attachments/*.png
            test-results/audit119-126/**/test-failed-*.png
            reports/audit119-126/results.json
          retention-days: 3
          if-no-files-found: warn
      - name: Upload synthetic screenshots, diagnostics and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-audit-119-126
          path: |
            test-results/audit119-126/
            reports/audit119-126/
          retention-days: 3
          if-no-files-found: warn

  profitability-filters:
    name: Isolated profitability filters (8 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install lockfile Playwright Chromium and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/audit136-137
          node node_modules/@playwright/test/cli.js install --with-deps chromium 2>&1 | tee reports/audit136-137/browser-install.log
      - name: Typecheck isolated fixture and tests
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p e2e/visual/audit136-137/tsconfig.json 2>&1 | tee reports/audit136-137/typecheck.log
      - name: Build isolated fixture (empty envDir, no app/backend)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/audit136-137
          node node_modules/vite/bin/vite.js build --config e2e/visual/audit136-137/vite.config.ts 2>&1 | tee reports/audit136-137/build.log
      - name: Check 8 browser cases
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config e2e/visual/audit136-137/playwright.config.ts 2>&1 | tee reports/audit136-137/browser.log
      - name: Require all 8 cases without skips
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { stats } = JSON.parse(readFileSync("reports/audit136-137/results.json", "utf8"));
          if (stats.expected !== 8 || stats.unexpected !== 0 || stats.skipped !== 0 || stats.flaky !== 0) {
            throw new Error(`Expected 8 passing GUI cases with no skips/retries: ${JSON.stringify(stats)}`);
          }
          JS
      - name: Upload compact synthetic screenshots and facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-audit-136-137-images-and-facts
          path: |
            test-results/audit136-137/**/*.png
            test-results/audit136-137/**/test-failed-*.png
            reports/audit136-137/results.json
          retention-days: 3
          if-no-files-found: warn
      - name: Upload synthetic screenshots, diagnostics and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-audit-136-137
          path: |
            test-results/audit136-137/
            reports/audit136-137/
          retention-days: 3
          if-no-files-found: warn

  virtualization:
    name: Isolated virtualization and table keyboard (8 cases, Chromium and Firefox)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Reuses the exact lockfile cache or bun install --frozen-lockfile --ignore-scripts.
      - uses: ./.github/actions/setup-bun
      - name: Record tested commit, lock hashes and installed versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/virtualization
          git diff --exit-code -- bun.lock package.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { createRequire } from "node:module";
          import { dirname, join } from "node:path";
          const require = createRequire(import.meta.url);
          const version = (name, resolver = require) => JSON.parse(readFileSync(resolver.resolve(`${name}/package.json`), "utf8")).version;
          const virtualRequire = createRequire(require.resolve("@tanstack/react-virtual/package.json"));
          const playwrightRequire = createRequire(require.resolve("@playwright/test/package.json"));
          const coreRequire = createRequire(playwrightRequire.resolve("playwright/package.json"));
          const browserManifest = join(dirname(coreRequire.resolve("playwright-core/package.json")), "browsers.json");
          const lock = readFileSync("bun.lock");
          const provenance = {
            testedCommit: execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
            node: process.version,
            bun: execFileSync("bun", ["--version"], { encoding: "utf8" }).trim(),
            lockfile: {
              gitBlob: createHash("sha1").update(`blob ${lock.length}\0`).update(lock).digest("hex"),
              sha256: createHash("sha256").update(lock).digest("hex"),
            },
            packages: Object.fromEntries([
              "@playwright/test", "@tanstack/react-virtual", "@tanstack/react-table",
              "react", "react-dom", "react-router", "typescript", "eslint", "vite",
            ].map(name => [name, version(name)])),
            virtualCore: version("@tanstack/virtual-core", virtualRequire),
            playwrightCore: version("playwright-core", coreRequire),
            browsers: JSON.parse(readFileSync(browserManifest, "utf8")).browsers
              .filter(browser => ["chromium", "firefox"].includes(browser.name)),
          };
          writeFileSync("reports/virtualization/provenance.json", `${JSON.stringify(provenance, null, 2)}\n`);
          console.log(JSON.stringify(provenance, null, 2));
          JS
      - name: Install lockfile Playwright Chromium, Firefox and system dependencies
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox 2>&1 | tee reports/virtualization/browser-install.log
      - name: Typecheck isolated virtualization fixture and tests
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc -p e2e/visual/virtualization/tsconfig.json 2>&1 | tee reports/virtualization/typecheck.log
      - name: Lint isolated virtualization fixture and tests
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/eslint/bin/eslint.js --no-cache e2e/visual/virtualization 2>&1 | tee reports/virtualization/lint.log
      - name: Check all 8 browser cases with a fresh isolated build
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config e2e/visual/virtualization/playwright.config.ts 2>&1 | tee reports/virtualization/browser.log
      - name: Require all 8 cases without skips or retries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { stats } = JSON.parse(readFileSync("reports/virtualization/results.json", "utf8"));
          if (stats.expected !== 8 || stats.unexpected !== 0 || stats.skipped !== 0 || stats.flaky !== 0) {
            throw new Error(`Expected 8 passing GUI cases with no skips/retries: ${JSON.stringify(stats)}`);
          }
          JS
      - name: Upload only synthetic virtualization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-ui-virtualization
          path: |
            test-results/virtualization/
            reports/virtualization/
          retention-days: 3
          if-no-files-found: warn
