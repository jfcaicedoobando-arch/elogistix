version: 2
# NOTA (GHA-audit 2026-07-29, H10): el digest pineado de la imagen Postgres
# de los tests RLS (`postgres@sha256:...` en `rls-tests.yml`, env/services)
# NO es actualizable por dependabot (los ecosistemas github-actions/docker
# no inspeccionan esa posición del YAML). Política: bump manual trimestral
# verificando la suite RLS completa.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"

  # Dependencias JS (bun.lock). Sin esto, las ~100 deps de package.json nunca
  # reciben PRs de actualización — dependency-review sólo audita PRs que ya
  # existen; nada los propone. Mantenimiento y migraciones mayores separados.
  # Familias acopladas primero: Dependabot usa el primer grupo que coincide.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      react-minor-patch:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["major"]
      router-minor-patch:
        patterns: ["react-router", "react-router-dom"]
        update-types: ["minor", "patch"]
      router-major:
        patterns: ["react-router", "react-router-dom"]
        update-types: ["major"]
      vitest-minor-patch:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      vitest-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      # Sólo version-updates (default). No cambia los grupos de seguridad.
      # Agrupar no fuerza versiones ausentes ni certifica compatibilidad;
      # las migraciones mayores requieren revisar/adaptar la familia completa.
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
