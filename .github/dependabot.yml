version: 2
# NOTA (GHA-audit 2026-07-29, H10): el digest pineado de la imagen Postgres
# de los tests RLS (`postgres@sha256:...` en `rls-tests.yml`, env/services)
# NO es actualizable por dependabot (los ecosistemas github-actions/docker
# no inspeccionan esa posición del YAML). Política: bump manual trimestral
# verificando la suite RLS completa.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"

  # Dependencias JS (bun.lock). Sin esto, las ~100 deps de package.json nunca
  # reciben PRs de actualización — dependency-review sólo audita PRs que ya
  # existen; nada los propone. Grupos para no inundar: minor/patch agrupados,
  # majors llegan individuales para revisión manual.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
