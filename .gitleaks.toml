# Gitleaks configuration for Libre Carga.
# Extiende reglas default y permite secretos públicos legítimos.

[extend]
useDefault = true

[allowlist]
description = "Allowlist global de secretos públicos del proyecto"

# Ola C · C.4 — Sin blanqueo por regex de secretos.
# El único lugar donde vive la anon key pública (rol `anon` de Lovable Cloud,
# segura por diseño) es el `.env` versionado por la plataforma. Se permite ese
# ARCHIVO, no el valor: así un secreto real pegado en código sí se detecta.

paths = [
  # .env generado por Lovable (sólo URL + claves publicables).
  '''^\.env$''',
  '''^\.env\.example$''',
  '''(.*?)(jpg|jpeg|png|gif|webp|svg|ico|pdf|woff2?|ttf|otf)$''',
  '''bun\.lockb$''',
  '''package-lock\.json$''',
]

# Gitleaks 8.24.3: these three verified SQL column joins are not credentials.
# Extend only this rule's allowlist; keep its default regex/entropy and all rules.
# Both the exact path AND complete match are required. No value-only exclusions.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Verified baseline SQL column joins; exact context only"
condition = "AND"
paths = ['''^supabase/schema/baseline\.sql$''']
regexTarget = "match"
regexes = ['''^auth\.users u ON u\.id = (?:fe2\.enviado_por|fe3\.subido_por|fe4\.capturado_por)$''']

[[rules.allowlists]]
description = "Verified historical Actions artifact 12014284809 ZIP digest; exact JSON context only"
condition = "AND"
paths = ['''^scripts/ci/demo-financial-retry-negative-review/origin-v2-evidence\.json$''']
regexTarget = "line"
# v8.24.3 location.go includes the preceding newline in finding.Line.
regexes = ['''^(?:\r?\n)?[ \t]*"api[_]sha256": "8b45e68934272812c51c75579c3c6f0b2c9602e057d653254b4f9605e2182607",[ \t]*(?:\r?\n)?$''']

[[rules.allowlists]]
description = "Verified Deno 2.9.7 official Windows ZIP digest; exact Markdown context only"
condition = "AND"
paths = ['''^e2e/visual/deferred-erp/README\.md$''']
regexTarget = "line"
# Public release integrity digest, verified against the official asset metadata.
# HEAD configuration covers this exact historical block without rewriting commits.
# The character class preserves the literal context without flagging this regex.
# Keep unsupported CRLF/EOF projections detectable; only the published LF block.
regexes = ['''^(?:\n)?su SHA256 coincide con el digest publicado por la AP[I] oficial de GitHub:\n`a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238`\.[ \t]*(?:\n)?$''']
